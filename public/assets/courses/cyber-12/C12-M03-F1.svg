<svg xmlns="http://www.w3.org/2000/svg" width="745" height="187" viewBox="0 0 745 187" role="img" aria-labelledby="t d">
<title id="t">C12-M03-F1: Where each pattern applies</title>
<desc id="d">A request passes through validation, authentication and object authorisation, then parameterised data access, and the response is encoded for its output context; errors are generic to clients and redacted in logs.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C12-M03-F1  Where each pattern applies</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  request --&gt; [VALIDATE input (allowlist)] --&gt; [AUTHENTICATE] --&gt; [AUTHORISE object]</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                                        |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            response &lt;-- [ENCODE output for context] &lt;-- [PARAMETERISED data access]</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  errors: generic to client, detailed to logs (redacted)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C12-M03-F1. The secure-coding patterns along a request&#x27;s path.</text>
</svg>