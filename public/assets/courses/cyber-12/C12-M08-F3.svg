<title id="t">C12-M08-F3: Findings lifecycle</title>
<desc id="d">A sequence from detection through deduplication, triage, remediation and verification to closure and learning.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C12-M08-F3  Findings lifecycle</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  detect -&gt; deduplicate/enrich -&gt; triage (TP / FP / accepted)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        -&gt; remediate (+ test) -&gt; verify (gate passes) -&gt; close -&gt; learn (rule,</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                                 paved road)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C12-M08-F3. A finding is closed only after the gate verifies the fix.</text>
