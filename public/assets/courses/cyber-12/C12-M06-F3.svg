<svg xmlns="http://www.w3.org/2000/svg" width="644" height="170" viewBox="0 0 644 170" role="img" aria-labelledby="t d">
<title id="t">C12-M06-F3: Leaked-secret response order</title>
<desc id="d">Five ordered steps from revoking the secret through investigation, fixing the cause, optional history cleaning and recording lessons.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C12-M06-F3  Leaked-secret response order</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  1 REVOKE/ROTATE at issuer --&gt; 2 INVESTIGATE usage logs --&gt; 3 FIX cause</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     (secrets manager, OIDC, scanning) --&gt; 4 CLEAN history (optional)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     --&gt; 5 RECORD lessons, search elsewhere</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C12-M06-F3. Revocation comes first; history cleaning cannot undo exposure.</text>
</svg>