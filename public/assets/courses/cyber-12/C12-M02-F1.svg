<title id="t">C12-M02-F1: DFD of the shipment service</title>
<desc id="d">A data-flow diagram with the customer, the shipment API process, the database and log stores, a notifier process calling a courier API, and a CI/CD process fetching from a package index, with four labelled trust boundaries.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
