<svg xmlns="http://www.w3.org/2000/svg" width="712" height="203" viewBox="0 0 712 203" role="img" aria-labelledby="t d">
<title id="t">C12-M04-F1: Taint analysis</title>
<desc id="d">A flow from a request parameter through a variable and a function to a database sink, with a sanitiser check determining whether a finding is raised.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C12-M04-F1  Taint analysis</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  SOURCE (request param) --&gt; variable --&gt; function call --&gt; SINK (db.execute)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                  |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                          SANITISER? (validate / parameterise)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            no sanitiser on path =&gt; FINDING      sanitiser present =&gt; no finding</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C12-M04-F1. Taint analysis reports a path from an untrusted source to a dangerous sink</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">without a sanitiser.</text>
</svg>