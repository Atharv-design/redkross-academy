<svg xmlns="http://www.w3.org/2000/svg" width="670" height="204" viewBox="0 0 670 204" role="img" aria-labelledby="t d">
<title id="t">C12-M05-F3: Prioritising an advisory</title>
<desc id="d">A decision tree prioritising exploited vulnerabilities first, then reachable and exposed ones, and otherwise routine upgrades or time-limited waivers.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C12-M05-F3  Prioritising an advisory</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  advisory --&gt; in KEV / exploited? --yes--&gt; fix within emergency SLA</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                     | no</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">              reachable + exposed? --yes--&gt; fix within severity SLA</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                     | no</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">              upgrade in next routine batch (bot PR), or waiver with expiry</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C12-M05-F3. A simple decision path for dependency advisories.</text>
</svg>