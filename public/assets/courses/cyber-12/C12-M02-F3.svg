<svg xmlns="http://www.w3.org/2000/svg" width="712" height="169" viewBox="0 0 712 169" role="img" aria-labelledby="t d">
<title id="t">C12-M02-F3: From threat to test</title>
<desc id="d">A left-to-right chain from threat to abuse case, requirement, mitigation, test or gate, and a register status of done.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C12-M02-F3  From threat to test</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  threat (STRIDE) --&gt; abuse case (expected behaviour) --&gt; requirement (ASVS)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        --&gt; mitigation (code/config) --&gt; test or gate --&gt; register status &quot;done&quot;</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="121" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C12-M02-F3. Each threat is traced to an abuse case, requirement, mitigation and</text>
<text x="20" y="137" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">verification.</text>
</svg>