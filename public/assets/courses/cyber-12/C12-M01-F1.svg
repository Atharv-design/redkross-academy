<svg xmlns="http://www.w3.org/2000/svg" width="779" height="221" viewBox="0 0 779 221" role="img" aria-labelledby="t d">
<title id="t">C12-M01-F1: Security activities across the lifecycle</title>
<desc id="d">A seven-stage pipeline from plan to operate, listing the security activities under each stage, with a loop from operate back to plan.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C12-M01-F1  Security activities across the lifecycle</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  PLAN -----&gt; DESIGN -----&gt; CODE -----&gt; BUILD -----&gt; TEST -----&gt; RELEASE -&gt; OPERATE</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  ASVS reqs   threat model  secure libs SAST, SCA    security    sign,      monitor,</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  abuse cases design review pre-commit  IaC scan,    tests, DAST SBOM,      vuln intake,</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  data class.               code review secrets      pentest     canary     patch</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      ^                                                                        |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      +---------------- root cause analysis feeds requirements ----------------+</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C12-M01-F1. Security activities at each stage, with feedback from operations into requirements.</text>
</svg>