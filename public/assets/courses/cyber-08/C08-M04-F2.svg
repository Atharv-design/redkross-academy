<svg xmlns="http://www.w3.org/2000/svg" width="686" height="220" viewBox="0 0 686 220" role="img" aria-labelledby="t d">
<title id="t">C08-M04-F2: Priority calculation</title>
<desc id="d">A formula multiplying severity, confidence and asset criticality, followed by four worked examples giving 10.8, 7.2, 7.2 and 3.6.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C08-M04-F2  Priority calculation</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  rule severity (1-4) x confidence (0-1) x asset criticality (1-3) = priority</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  R5 log cleared        4 x 0.9 x 3 (finance WS) = 10.8</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  R2 spray -&gt; success   4 x 0.9 x 2 (sales)      =  7.2</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  R1 Word -&gt; PowerShell 3 x 0.8 x 3              =  7.2</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  R6 regular beacon     2 x 0.6 x 3              =  3.6</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C08-M04-F2. How the triage helper computes priority, with values from the</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">execution-tested run.</text>
</svg>