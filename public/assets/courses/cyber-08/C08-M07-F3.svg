<svg xmlns="http://www.w3.org/2000/svg" width="653" height="220" viewBox="0 0 653 220" role="img" aria-labelledby="t d">
<title id="t">C08-M07-F3: Evidence integrity chain</title>
<desc id="d">A flow from a query to a raw export, its SHA-256 hash and manifest, with a custody log entry, and a later verification step returning OK or FAILED.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C08-M07-F3  Evidence integrity chain</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  query (host, window) --&gt; raw export (.jsonl) --&gt; SHA-256 --&gt; SHA256SUMS</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           |                                          |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           +------------&gt; custody.jsonl (who, when, what, hash)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                      |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">             later: re-hash and compare -&gt; OK / FAILED (tampering)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C08-M07-F3. Exported evidence is hashed, recorded in a manifest and custody</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">log, and verified before use.</text>
</svg>