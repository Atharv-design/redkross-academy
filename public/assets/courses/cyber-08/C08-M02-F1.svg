<title id="t">C08-M02-F1: Telemetry families</title>
<desc id="d">Three columns of sources - endpoint, network and identity/cloud - with arrows into a collection pipeline and SIEM.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C08-M02-F1  Telemetry families</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   ENDPOINT                 NETWORK                  IDENTITY / CLOUD</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Windows Security/System  firewall, proxy (284)    AD/IdP sign-ins, MFA</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Sysmon (33), PowerShell  DNS, flow (NetFlow)      VPN (10)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   EDR, auditd, journal     IDS/NDR, packets         CloudTrail / Activity Log</text>
