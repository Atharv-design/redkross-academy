<svg xmlns="http://www.w3.org/2000/svg" width="619" height="204" viewBox="0 0 619 204" role="img" aria-labelledby="t d">
<title id="t">C08-M07-F2: Containment options versus evidence and impact</title>
<desc id="d">A table rating four containment options on stopping the attacker, preserving evidence and business impact; power off preserves the least evidence.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C08-M07-F2  Containment options versus evidence and impact</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  option              stops attacker  keeps evidence  business impact</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  EDR network isolate high            high (memory)   medium</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  block domain/IP     partial         high            low</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  reset + revoke      high (creds)    high            medium</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  power off           high            LOW (volatile)  high</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C08-M07-F2. Trade-offs of common containment actions.</text>
</svg>