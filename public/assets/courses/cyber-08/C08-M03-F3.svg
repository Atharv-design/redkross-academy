<svg xmlns="http://www.w3.org/2000/svg" width="712" height="220" viewBox="0 0 712 220" role="img" aria-labelledby="t d">
<title id="t">C08-M03-F3: Query building blocks across languages</title>
<desc id="d">A table mapping filter, aggregate, distinct count and time bucket operations to SQL, SPL and KQL equivalents.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C08-M03-F3  Query building blocks across languages</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  operation   SQL (minisiem)        SPL (Splunk)          KQL (Sentinel)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  filter      WHERE ...             search ... / where    | where ...</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  aggregate   GROUP BY + COUNT      stats count by        | summarize count() by</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  distinct    COUNT(DISTINCT x)     dc(x)                 dcount(x)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  time bucket substr / strftime     bin _time span=1h     bin(TimeGenerated, 1h)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C08-M03-F3. The same search operations in three query languages (syntax summarised;</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">consult product documentation).</text>
</svg>