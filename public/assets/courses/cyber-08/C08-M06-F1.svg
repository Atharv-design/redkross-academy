<svg xmlns="http://www.w3.org/2000/svg" width="636" height="203" viewBox="0 0 636 203" role="img" aria-labelledby="t d">
<title id="t">C08-M06-F1: Detection lifecycle</title>
<desc id="d">A loop of eight stages from requirement through deploy and monitor, returning via tune or retire to requirement.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C08-M06-F1  Detection lifecycle</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   requirement --&gt; research --&gt; develop --&gt; test --&gt; review --&gt; deploy</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        ^                                                          |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |                                                          v</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   retire / tune  &lt;------------------ monitor (volume, TP/FP, feedback)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C08-M06-F1. Detections are built, tested, deployed and then monitored and</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">tuned in a loop.</text>
</svg>