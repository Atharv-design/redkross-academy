<title id="t">C08-M08-F2: Beacon regularity</title>
<desc id="d">Two rows of tick marks: evenly spaced ticks for the beacon with coefficient of variation 0.004, and unevenly spaced ticks for human browsing with 0.345.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
