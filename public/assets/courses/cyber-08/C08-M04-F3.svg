<title id="t">C08-M04-F3: One case from many alerts</title>
<desc id="d">Six timed events on WS-104 feed into a single case, while the VPN spray connects to it by a dotted line marked hypothesis.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C08-M04-F3  One case from many alerts</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  06:12 download invoice.docm ---+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  06:14 R1 Word-&gt;PowerShell -----+</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  06:17-07:42 R6 beacon x18 -----+--&gt; CASE: WS-104 / divya (phishing -&gt;</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  07:02-07:03 R3 svc_update -----+         persistence -&gt; exfiltration?)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  08:12 R4 48.2 MB upload -------+</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  08:17 R5 log cleared ----------+</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  06:42-06:46 R2 VPN spray, gopal ...&gt; linked? (hypothesis)</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C08-M04-F3. Grouping alerts by shared entities into one case, with an</text>
