<svg xmlns="http://www.w3.org/2000/svg" width="636" height="220" viewBox="0 0 636 220" role="img" aria-labelledby="t d">
<title id="t">C09-M08-F1: Anatomy of a defensible report</title>
<desc id="d">A flow from questions to evidence, methods, timeline, findings, limitations and conclusions, with appendices supporting the whole report.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C09-M08-F1  Anatomy of a defensible report</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  questions &amp; authority --&gt; evidence (IDs, hashes) --&gt; methods &amp; tools</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                            |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           conclusions &lt;-- limitations &lt;-- findings &lt;-- timeline</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">               |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           appendices (evidence table, commands, outputs, glossary, CV)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C09-M08-F1. Each section builds on the previous one, and every finding</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">traces back to identified evidence.</text>
</svg>