<svg xmlns="http://www.w3.org/2000/svg" width="686" height="220" viewBox="0 0 686 220" role="img" aria-labelledby="t d">
<title id="t">C09-M03-F1: GPT disk layout</title>
<desc id="d">A horizontal bar showing protective MBR at LBA 0, GPT header at LBA 1, entries, two partitions, an unallocated gap and backup structures at the end of the disk.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C09-M03-F1  GPT disk layout</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  LBA0      LBA1        LBA2-33          ...                 end-33..end</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  +-------+-----------+----------------+-----+-----+-------+----------------+</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  |prot.  | GPT       | partition      | P1  | P2  | gaps? | backup entries |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  |MBR    | header    | entries (128)  |     |     |       | + backup header|</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  +-------+-----------+----------------+-----+-----+-------+----------------+</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C09-M03-F1. A GPT disk with protective MBR, primary header and entries,</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">partitions, possible gaps and backup structures at the end.</text>
</svg>