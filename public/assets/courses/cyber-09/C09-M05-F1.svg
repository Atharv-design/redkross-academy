<svg xmlns="http://www.w3.org/2000/svg" width="611" height="220" viewBox="0 0 611 220" role="img" aria-labelledby="t d">
<title id="t">C09-M05-F1: Logon session correlation</title>
<desc id="d">A tree rooted at a 4624 logon event with branches to 4672, process creation, persistence events and 4634, all linked by the same logon ID.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C09-M05-F1  Logon session correlation</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  4624 (type 10, ip, logonid 0x5A1F)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |-- 4672 same logonid  -&gt; privileged session</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |-- 4688 / Sysmon 1 with SubjectLogonId 0x5A1F -&gt; processes run</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |-- 4698 / 7045 in window -&gt; persistence created?</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     &#x27;-- 4634 same logonid  -&gt; session end</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C09-M05-F1. The logon ID ties privilege, process and logoff events to</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">one session.</text>
</svg>