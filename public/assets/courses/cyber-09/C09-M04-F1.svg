<svg xmlns="http://www.w3.org/2000/svg" width="619" height="305" viewBox="0 0 619 305" role="img" aria-labelledby="t d">
<title id="t">C09-M04-F1: Memory acquisition decision</title>
<desc id="d">A decision tree. Powered-off systems use on-disk memory remnants, VMs use hypervisor snapshots, and physical systems use an approved tool writing to external storage, followed by hashing and then disk acquisition.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C09-M04-F1  Memory acquisition decision</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  system running?</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">    |no  -&gt; check hiberfil.sys / pagefile / crash dumps on disk image</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">    |yes</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">    v</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  VM? --yes--&gt; hypervisor snapshot/suspend (.vmem) -&gt; hash</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">    |no</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">    v</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  approved tool (WinPmem/DumpIt/LiME/AVML) from external media</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">    -&gt; output to external/network storage -&gt; hash -&gt; record footprint</text>
<text x="20" y="213" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">    -&gt; THEN disk acquisition and containment</text>
<text x="20" y="230" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="257" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C09-M04-F1. Choosing a memory acquisition path before containment or</text>
<text x="20" y="273" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">shutdown.</text>
</svg>