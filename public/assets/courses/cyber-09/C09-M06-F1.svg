<svg xmlns="http://www.w3.org/2000/svg" width="636" height="305" viewBox="0 0 636 305" role="img" aria-labelledby="t d">
<title id="t">C09-M06-F1: The lab&#x27;s isolated capture setup</title>
<desc id="d">A server container with a capture container sharing its network, a client container on the same private bridge, and the pcap copied out for analysis in a separate container.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C09-M06-F1  The lab&#x27;s isolated capture setup</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  Docker bridge rk-c09-net 172.31.0.0/24 (no external routing used)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +-------------------------------+          +------------------+</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   | rk9-web 172.31.0.10:80        |&lt;--------&gt;| client           |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  python -m http.server        |  HTTP    | 172.31.0.20      |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  [rk9-cap shares namespace:   |          | curl             |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |   tcpdump -w c09.pcap port 80]|          +------------------+</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +-------------------------------+</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">              | docker cp</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">              v</text>
<text x="20" y="213" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   rk_c09_lab.pcap --&gt; tshark (separate container) --&gt; objects + hashes</text>
<text x="20" y="230" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="257" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C09-M06-F1. A contained capture: the sensor shares the server&#x27;s network</text>
<text x="20" y="273" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">namespace on a private bridge.</text>
</svg>