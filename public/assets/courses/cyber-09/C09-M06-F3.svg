<title id="t">C09-M06-F3: Super-timeline of the lab incident</title>
<desc id="d">A five-row timeline from SSH login through staging with sudo, HTTP download and probe, to disconnection.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C09-M06-F3  Super-timeline of the lab incident</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  05:49:12  auth.log   SSH key login: deploy from 172.31.0.20</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  05:50:03  auth.log   sudo cp customers.csv -&gt; /srv/backup (staging)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  05:51:40  access+pcap GET /backup/customers.csv 200 (hash matches)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  05:51:40  access+pcap GET /backup/missing.zip 404 (probe)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  05:52:30  auth.log   SSH disconnect</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C09-M06-F3. Host and network evidence merged in UTC (execution-tested;</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">auth and access logs synthetic).</text>
</svg>