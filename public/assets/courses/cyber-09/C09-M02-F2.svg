<svg xmlns="http://www.w3.org/2000/svg" width="720" height="203" viewBox="0 0 720 203" role="img" aria-labelledby="t d">
<title id="t">C09-M02-F2: One-pass hashing pipeline</title>
<desc id="d">A stream from dd splits at tee into the image file and sha256sum; the re-hashed file and the stream hash both equal e3a7...f21.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C09-M02-F2  One-pass hashing pipeline</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  source --dd--&gt; byte stream --tee--+--&gt; evidence.dd --(re-hash)--&gt; e3a7...f21</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                    |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                    +--&gt; sha256sum ------------------&gt; e3a7...f21</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                          must match</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C09-M02-F2. The lab pipeline hashes the stream and the written file; both equal the</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">source hash (execution-tested).</text>
</svg>