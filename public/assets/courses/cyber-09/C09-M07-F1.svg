<svg xmlns="http://www.w3.org/2000/svg" width="686" height="271" viewBox="0 0 686 271" role="img" aria-labelledby="t d">
<title id="t">C09-M07-F1: IR lifecycle and CSF 2.0 alignment</title>
<desc id="d">Four phase boxes from preparation to recovery, labelled with the CSF functions above them, and a loop from recovery through lessons learned back to preparation.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C09-M07-F1  IR lifecycle and CSF 2.0 alignment</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   GOVERN / IDENTIFY / PROTECT        DETECT           RESPOND        RECOVER</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +------------------+   +-----------------+   +-------------+   +--------+</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |   PREPARATION    |--&gt;| DETECTION &amp;     |--&gt;| CONTAINMENT |--&gt;|RECOVERY|</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   | plan, playbooks, |   | ANALYSIS,       |   | ERADICATION |   |        |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   | tools, backups   |   | scoping         |   |             |   |        |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +------------------+   +-----------------+   +-------------+   +--------+</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            ^                                                          |</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            +-------------------- LESSONS LEARNED &lt;--------------------+</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C09-M07-F1. Classic IR phases mapped to CSF 2.0 functions, with lessons learned</text>
<text x="20" y="239" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">feeding preparation [C09-M07-R1].</text>
