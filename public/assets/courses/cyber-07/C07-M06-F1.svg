<svg xmlns="http://www.w3.org/2000/svg" width="703" height="204" viewBox="0 0 703 204" role="img" aria-labelledby="t d">
<title id="t">C07-M06-F1: Wi-Fi security mode strength</title>
<desc id="d">A strength ladder of Wi-Fi security modes from broken WEP and WPA up to acceptable WPA2-AES and preferred WPA3.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M06-F1  Wi-Fi security mode strength</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WEP   broken (never use)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WPA   weak  (never use)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WPA2  AES-CCMP; acceptable; PSK handshake has weaknesses (patch; strong key)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WPA3  SAE handshake; resists offline guessing; preferred</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   rule: WPA3 preferred, WPA2-AES minimum, never WEP/WPA</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M06-F1. Wi-Fi security modes from broken (WEP) to preferred (WPA3) [C07-M06-R1].</text>
</svg>