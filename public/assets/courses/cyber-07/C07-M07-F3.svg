<title id="t">C07-M07-F3: Lab telemetry - detect, correlate, contain</title>
<desc id="d">The lab&#x27;s scan and beacon signals, their correlation to a single external host, and the containment actions for each.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M07-F3  Lab telemetry - detect, correlate, contain</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   SCAN   203.0.113.50 -&gt; dmz : 60 ports/59s   -&gt; perimeter block/limit source</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   BEACON 10.4.0.21 -&gt; 203.0.113.50 : 60s      -&gt; isolate host; block flow</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   note: scan source == beacon destination (203.0.113.50) -&gt; one intrusion</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   segmentation already denied user-&gt;db -&gt; damage limited</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M07-F3. The lab&#x27;s signals detected, correlated to one external host, and</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">matched to containment actions.</text>
