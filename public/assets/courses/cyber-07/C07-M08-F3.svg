<svg xmlns="http://www.w3.org/2000/svg" width="661" height="186" viewBox="0 0 661 186" role="img" aria-labelledby="t d">
<title id="t">C07-M08-F3: Evidence over attestation</title>
<desc id="d">A contrast between unverified attestation and reproducible, evidence-backed verification.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M08-F3  Evidence over attestation</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   attestation: &quot;we have a firewall / HTTPS&quot;   -&gt; unverified, often wrong</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   evidence    : check output, before/after    -&gt; reproducible, defensible</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   every claim in the assessment traces to a re-runnable tool output</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M08-F3. A network assessment is evidence (reproducible checks), not</text>
<text x="20" y="154" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">attestation [C07-M08-R1].</text>
</svg>