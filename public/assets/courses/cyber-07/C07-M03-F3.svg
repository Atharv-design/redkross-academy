<svg xmlns="http://www.w3.org/2000/svg" width="569" height="237" viewBox="0 0 569 237" role="img" aria-labelledby="t d">
<title id="t">C07-M03-F3: Tuning separates signal from noise</title>
<desc id="d">Two tuned thresholds showing normal traffic staying below them and the embedded scan and beacon crossing them to alert.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M03-F3  Tuning separates signal from noise</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   scan threshold: &gt;= 20 distinct ports / host within 120s</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     normal web (1 port, 443) -&gt; below threshold -&gt; NO alert</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     scan (60 ports in 59s)   -&gt; over threshold  -&gt; ALERT</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   beacon threshold: &gt;= 8 contacts, interval variance &lt;= jitter</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     jittered normal traffic  -&gt; variance too high -&gt; NO alert</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     C2 beacon (exact 60s)    -&gt; low variance       -&gt; ALERT</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M03-F3. Thresholds tuned so genuine patterns fire and normal</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">traffic stays quiet - the false-positive/false-negative balance.</text>
</svg>