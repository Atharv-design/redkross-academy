<svg xmlns="http://www.w3.org/2000/svg" width="644" height="203" viewBox="0 0 644 203" role="img" aria-labelledby="t d">
<title id="t">C07-M02-F3: Stateful inspection</title>
<desc id="d">A diagram showing a stateful firewall recording an outbound connection and automatically permitting the return traffic without a separate rule.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M02-F3  Stateful inspection</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   app --SYN--&gt; db:5432   (allowed by rule)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   firewall records the connection in its state table</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   db --reply--&gt; app      (automatically allowed - return traffic)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   no separate inbound rule needed; packets not in the table are dropped</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M02-F3. A stateful firewall tracks connections and allows return traffic</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">automatically [C07-M02-R1].</text>
</svg>