<svg xmlns="http://www.w3.org/2000/svg" width="686" height="186" viewBox="0 0 686 186" role="img" aria-labelledby="t d">
<title id="t">C07-M04-F2: Segmentation limits lateral movement</title>
<desc id="d">A contrast between a flat network where an entry host reaches the database directly and a segmented network where that path is denied.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M04-F2  Segmentation limits lateral movement</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   flat network:    entry host ---&gt; can reach ---&gt; DATABASE (one hop, breach)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   segmented:       entry host -X-&gt; db (denied) ; must cross app boundary</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                    (controlled + monitored) -&gt; compromise contained</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M04-F2. Segmentation forces an attacker across controlled boundaries, limiting</text>
<text x="20" y="154" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">blast radius [C07-M04-R2].</text>
</svg>