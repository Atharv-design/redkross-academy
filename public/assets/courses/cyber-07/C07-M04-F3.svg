<svg xmlns="http://www.w3.org/2000/svg" width="695" height="203" viewBox="0 0 695 203" role="img" aria-labelledby="t d">
<title id="t">C07-M04-F3: Design, enforce, validate</title>
<desc id="d">A three-step loop of designing the segmentation matrix, enforcing it with firewalls, and validating observed flows against it.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M04-F3  Design, enforce, validate</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   DESIGN   the allowed-flow matrix (intended policy)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   ENFORCE  firewall/ACLs implement it at boundaries</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   VALIDATE compare observed/configured flows to the matrix -&gt; flag violations</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   the lab: 3 of 7 connections violate -&gt; fix enforcement -&gt; revalidate</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M04-F3. Segmentation is assured by a closed loop of design, enforcement and</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">validation.</text>
</svg>