<svg xmlns="http://www.w3.org/2000/svg" width="535" height="203" viewBox="0 0 535 203" role="img" aria-labelledby="t d">
<title id="t">C07-M05-F3: TLS configuration review - weak versus hardened</title>
<desc id="d">A comparison of the weak TLS configuration (legacy protocols, weak ciphers, 1024-bit key, near-expiry cert) and the hardened one.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M05-F3  TLS configuration review - weak versus hardened</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   PRE-HARDENING (5 HIGH)        HARDENED (0)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   TLS 1.0/1.1/1.2               TLS 1.2/1.3 only</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   RC4, 3DES, AES-GCM            AES-GCM, ChaCha20-Poly1305</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   RSA 1024-bit; cert in 12 days RSA 2048-bit; cert far off</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M05-F3. The offline review moves the edge from five HIGH</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">weaknesses to none [C07-M05-R3].</text>
</svg>