<svg xmlns="http://www.w3.org/2000/svg" width="712" height="203" viewBox="0 0 712 203" role="img" aria-labelledby="t d">
<title id="t">C07-M03-F1: IDS versus IPS</title>
<desc id="d">A comparison of an out-of-line IDS that only alerts and an in-line IPS that can block, with the cost of false positives for each.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M03-F1  IDS versus IPS</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   IDS  (out-of-line): sees traffic -&gt; ALERT (no block). FP = just an alert.</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   IPS  (in-line):     sees traffic -&gt; ALERT + BLOCK.    FP = blocks good</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                          traffic (availability)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   place sensors at trust boundaries with visibility (tap/span/in-line)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M03-F1. IDS alerts; IPS can block but a false positive harms availability, so IPS</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">rules must be high-confidence [C07-M03-R1].</text>
</svg>