<svg xmlns="http://www.w3.org/2000/svg" width="569" height="220" viewBox="0 0 569 220" role="img" aria-labelledby="t d">
<title id="t">C07-M02-F2: The five policy weaknesses a linter catches</title>
<desc id="d">A list of five common firewall policy weaknesses with the remediation for each.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C07-M02-F2  The five policy weaknesses a linter catches</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   no default-deny (HIGH)   -&gt; add final &quot;deny any any any any&quot;</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   allow-any-any (HIGH)     -&gt; remove / tightly scope</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   over-broad ports (LOW)   -&gt; narrow to specific service ports</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   shadowed rule (MEDIUM)   -&gt; reorder/remove dead rules</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   no egress filtering(MED) -&gt; control outbound too</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C07-M02-F2. Recurring firewall policy weaknesses and their fixes,</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">as flagged by the lab linter [C07-M02-R1].</text>
</svg>