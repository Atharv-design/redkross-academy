<svg xmlns="http://www.w3.org/2000/svg" width="737" height="203" viewBox="0 0 737 203" role="img" aria-labelledby="t d">
<title id="t">C16-M01-F1: SSID, BSSID and the broadcast medium</title>
<desc id="d">An SSID served by multiple authorised BSSIDs over a broadcast medium, with an attacker able to advertise the same SSID.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C16-M01-F1  SSID, BSSID and the broadcast medium</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   SSID &quot;HimalayaCorp&quot; (a NAME, not a boundary)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     served by many BSSIDs (AP radios): 02:11:aa:00:00:01, ...:02</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   radio = broadcast: anyone in range hears it (car park, next floor, street)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   =&gt; an attacker can also advertise &quot;HimalayaCorp&quot; on an unknown BSSID (evil twin)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C16-M01-F1. One SSID, many BSSIDs; the SSID is a name anyone can advertise over a</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">broadcast medium [C16-M01-R1].</text>
</svg>