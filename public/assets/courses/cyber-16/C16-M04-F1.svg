<title id="t">C16-M04-F1: Bluetooth/BLE and pairing flow</title>
<desc id="d">BR/EDR and BLE and the discover-pair-bond-connect flow, with security resting on association model and key agreement.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C16-M04-F1  Bluetooth/BLE and pairing flow</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   BR/EDR (Classic) : audio/file/legacy       BLE : low power (wearables/IoT)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   discover -&gt; pair (keys) -&gt; bond (store) -&gt; encrypted link</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   security depends on: association model (MITM?) + key agreement (strength)</text>
