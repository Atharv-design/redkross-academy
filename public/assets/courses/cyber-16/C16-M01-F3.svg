<svg xmlns="http://www.w3.org/2000/svg" width="577" height="254" viewBox="0 0 577 254" role="img" aria-labelledby="t d">
<title id="t">C16-M01-F3: Threat surface to control map</title>
<desc id="d">A mapping of each Wi-Fi threat to its defensive control.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C16-M01-F3  Threat surface to control map</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   eavesdropping    -&gt; strong encryption (WPA2-AES / WPA3)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   weak/legacy crypto-&gt; require AES-CCMP/GCMP (no WEP/TKIP)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   rogue AP         -&gt; inventory + detection</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   evil twin        -&gt; PMF + strong auth + detection + awareness</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   deauth           -&gt; PMF (802.11w)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WPS brute force  -&gt; disable WPS</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   weak mgmt/firmware-&gt; harden AP admin + patch</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C16-M01-F3. Each Wi-Fi threat maps to a specific defensive control</text>
<text x="20" y="222" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">[C16-M01-R3].</text>
</svg>