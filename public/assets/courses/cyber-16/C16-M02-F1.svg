<svg xmlns="http://www.w3.org/2000/svg" width="686" height="203" viewBox="0 0 686 203" role="img" aria-labelledby="t d">
<title id="t">C16-M02-F1: WPA2 vs WPA3</title>
<desc id="d">A comparison of WPA2 and WPA3 with the modern baseline of AES, WPA3 and required PMF.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C16-M02-F1  WPA2 vs WPA3</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WPA2 (2004): AES-CCMP; Personal=PSK (offline-guessable), Enterprise=802.1X</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WPA3 (2018): Personal=SAE (resists offline guessing); Enterprise stronger;</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                PMF REQUIRED; mandatory for new certified devices</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   baseline: require AES; prefer WPA3; require PMF; never WEP/TKIP</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C16-M02-F1. WPA2 and WPA3; the modern baseline requires AES, WPA3 and PMF</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">[C16-M02-R1].</text>
</svg>