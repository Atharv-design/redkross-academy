<title id="t">C16-M03-F3: Impostor classification (lab scan)</title>
<desc id="d">The classification categories and the lab&#x27;s two evil-twin findings.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C16-M03-F3  Impostor classification (lab scan)</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   authorised : BSSID in inventory for its SSID            -&gt; OK</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   evil twin  : managed SSID on UNKNOWN BSSID              -&gt; HIGH (investigate)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   ssid mismatch: authorised BSSID, unexpected SSID        -&gt; HIGH</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   foreign    : non-managed SSID (neighbour)               -&gt; INFO</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   lab: 66:de:ad:be:ef:01 OPEN + :02 WPA2 on HimalayaCorp  -&gt; 2 evil twins</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C16-M03-F3. How roguescan.py classifies the provided scan [C16-M03-R2].</text>
