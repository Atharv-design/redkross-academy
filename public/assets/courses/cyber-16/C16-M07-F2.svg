<svg xmlns="http://www.w3.org/2000/svg" width="703" height="187" viewBox="0 0 703 187" role="img" aria-labelledby="t d">
<title id="t">C16-M07-F2: The three pillars</title>
<desc id="d">Three pillars of mobile API security.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C16-M07-F2  The three pillars</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   AUTHENTICATION : validated, short-lived, revocable tokens; no client trust</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   TRANSPORT      : TLS everywhere, strong TLS, (pinning option)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   BACKEND HARDEN : per-request authorisation, rate limiting, input validation,</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                    generic errors, minimal data, logging</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C16-M07-F2. Authentication, transport and backend hardening [C16-M07-R1].</text>
</svg>