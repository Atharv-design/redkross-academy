<title id="t">C16-M08-F1: The wireless-and-mobile surface</title>
<desc id="d">The radio edge and the mobile system with the course&#x27;s unifying principles.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C16-M08-F1  The wireless-and-mobile surface</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   RADIO EDGE : Wi-Fi hardening + rogue/evil-twin detection ; Bluetooth/BLE</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   MOBILE     : app (storage, crypto, platform, insecure data handling)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                API (auth, transport, authorisation, rate limiting)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   principles : hostile network -&gt; encrypt ; untrusted client -&gt; enforce server-side</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                verify controls (FAIL-&gt;PASS) ; authorised, offline, do no harm</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C16-M08-F1. The whole wireless-and-mobile surface and its principles.</text>
