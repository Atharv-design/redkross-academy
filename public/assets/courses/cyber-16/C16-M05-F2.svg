<svg xmlns="http://www.w3.org/2000/svg" width="678" height="186" viewBox="0 0 678 186" role="img" aria-labelledby="t d">
<title id="t">C16-M05-F2: Where app data should live</title>
<desc id="d">Correct storage locations for sensitive data and keys versus insecure ones.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C16-M05-F2  Where app data should live</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   sensitive data -&gt; INTERNAL (app-private) storage, ENCRYPTED    [correct]</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   keys           -&gt; platform KEYSTORE (hardware-backed)          [correct]</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   NOT: external/shared storage | logs | hardcoded in the app     [insecure]</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C16-M05-F2. Sensitive data belongs in private, encrypted storage; keys in the</text>
<text x="20" y="154" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">keystore [C16-M05-R2].</text>
</svg>