<svg xmlns="http://www.w3.org/2000/svg" width="577" height="271" viewBox="0 0 577 271" role="img" aria-labelledby="t d">
<title id="t">C15-M01-F2: From entropy to token</title>
<desc id="d">A vertical flow from hardware entropy to the kernel generator to Python&#x27;s secrets module, with a note excluding the random module.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C15-M01-F2  From entropy to token</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  hardware noise, interrupts, CPU RNG</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          v</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  kernel CSPRNG (getrandom / BCryptGenRandom)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          v</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  os.urandom / secrets.token_*  --&gt;  keys, nonces, salts, tokens</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  (NOT random.Random - deterministic from seed)</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C15-M01-F2. Security values must come from the OS CSPRNG, not a</text>
<text x="20" y="239" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">general-purpose PRNG.</text>
</svg>