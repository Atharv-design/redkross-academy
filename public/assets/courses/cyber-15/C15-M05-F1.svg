<svg xmlns="http://www.w3.org/2000/svg" width="670" height="238" viewBox="0 0 670 238" role="img" aria-labelledby="t d">
<title id="t">C15-M05-F1: Lab PKI hierarchy</title>
<desc id="d">A vertical chain from a self-signed root to an issuing intermediate to a server leaf certificate, with constraints and lifetimes for each.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C15-M05-F1  Lab PKI hierarchy</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  Tamarind Lab Root CA (self-signed, CA:TRUE, 3650 d, OFFLINE in real life)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            v signs</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  Tamarind Lab Issuing CA (CA:TRUE, pathlen:0, 1825 d)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            v signs</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  track.tamarind.example (CA:FALSE, serverAuth, SAN, 90 d)</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C15-M05-F1. The three-tier PKI created in the lab.</text>
</svg>