<svg xmlns="http://www.w3.org/2000/svg" width="661" height="187" viewBox="0 0 661 187" role="img" aria-labelledby="t d">
<title id="t">C15-M04-F2: Choosing an integrity mechanism</title>
<desc id="d">A decision list mapping four situations to a hash, HMAC or AEAD, a signature, or a hash delivered through a trusted channel.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C15-M04-F2  Choosing an integrity mechanism</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  accidental corruption only?      -&gt; hash (SHA-256)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  attacker, shared secret?         -&gt; HMAC (or AEAD if encrypting)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  attacker, public verification?   -&gt; digital signature over hash</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  checksum published separately?   -&gt; hash + trusted channel (HTTPS, form)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C15-M04-F2. Selecting hash, HMAC, AEAD or signature by threat and verifier.</text>
</svg>