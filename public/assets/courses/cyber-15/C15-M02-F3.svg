<svg xmlns="http://www.w3.org/2000/svg" width="728" height="204" viewBox="0 0 728 204" role="img" aria-labelledby="t d">
<title id="t">C15-M02-F3: Envelope encryption</title>
<desc id="d">A file is encrypted with a data key, which is wrapped by a KMS key; both are stored together, and decryption requires the KMS to unwrap the data key.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C15-M02-F3  Envelope encryption</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  file --AES-GCM(DEK)--&gt; ciphertext ---------------------+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  DEK  --wrap(KEK in KMS, authorised + logged)--&gt; wrapped DEK</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                         v</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                              stored together: [wrapped DEK | key_id | ciphertext]</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  decrypt: KMS unwrap(wrapped DEK) -&gt; DEK -&gt; AES-GCM decrypt</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C15-M02-F3. Data keys encrypt data; the KMS key wraps data keys.</text>
</svg>