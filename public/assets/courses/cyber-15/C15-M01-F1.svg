<svg xmlns="http://www.w3.org/2000/svg" width="560" height="221" viewBox="0 0 560 221" role="img" aria-labelledby="t d">
<title id="t">C15-M01-F1: Goals and the primitives that provide them</title>
<desc id="d">A two-column table mapping five security goals to the cryptographic primitives that provide them.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C15-M01-F1  Goals and the primitives that provide them</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  goal               primitive</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  confidentiality -&gt; encryption (AEAD), KEM/key exchange</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  integrity       -&gt; MAC, AEAD tag, signature</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  authenticity    -&gt; MAC (shared key), signature (private key)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  non-repudiation -&gt; signature + key custody</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  forward secrecy -&gt; ephemeral key exchange</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C15-M01-F1. Each security goal maps to specific primitives.</text>
</svg>