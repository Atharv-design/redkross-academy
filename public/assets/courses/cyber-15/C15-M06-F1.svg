<svg xmlns="http://www.w3.org/2000/svg" width="653" height="271" viewBox="0 0 653 271" role="img" aria-labelledby="t d">
<title id="t">C15-M06-F1: TLS 1.3 handshake (1-RTT)</title>
<desc id="d">A two-party exchange where the client sends a hello with key shares, the server replies with its key share and an encrypted certificate, signature and finished message, the client verifies and finishes, and encrypted application data follows.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C15-M06-F1  TLS 1.3 handshake (1-RTT)</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  Client                                           Server</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  ClientHello (versions, suites, key_share X25519, SNI) ----&gt;</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">              &lt;---- ServerHello (key_share)  [ECDHE secret -&gt; HKDF keys]</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">              &lt;---- {EncryptedExtensions, Certificate, CertificateVerify,</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                     Finished}                 (encrypted)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  verify chain + hostname + signature</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  {Finished} ----&gt;</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  [application data, AEAD] &lt;====================&gt; [application data]</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C15-M06-F1. The TLS 1.3 handshake: key shares in the first flight, an</text>
<text x="20" y="239" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">encrypted server flight with certificate proof, then application data.</text>
</svg>