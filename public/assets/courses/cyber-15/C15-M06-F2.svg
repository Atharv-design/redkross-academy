<svg xmlns="http://www.w3.org/2000/svg" width="636" height="204" viewBox="0 0 636 204" role="img" aria-labelledby="t d">
<title id="t">C15-M06-F2: Lab outcomes</title>
<desc id="d">A list of five client configurations and their results: one success and four distinct failures.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C15-M06-F2  Lab outcomes</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  trusted root + right name   -&gt; TLSv1.3 TLS_AES_256_GCM_SHA384  OK</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  wrong name                  -&gt; hostname mismatch</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  no lab root in trust store  -&gt; unable to get local issuer certificate</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  client max TLS 1.1          -&gt; no ciphers available (client side)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  server min TLS 1.3, client max 1.2 -&gt; protocol version alert</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C15-M06-F2. Five execution-tested TLS outcomes.</text>
