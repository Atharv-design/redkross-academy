<svg xmlns="http://www.w3.org/2000/svg" width="569" height="203" viewBox="0 0 569 203" role="img" aria-labelledby="t d">
<title id="t">C15-M07-F3: Library preference</title>
<desc id="d">A ranked list from protocols and managed services, to high-level libraries, to low-level primitives, with home-made cryptography excluded.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C15-M07-F3  Library preference</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  1 protocols/services (TLS, KMS, HSM)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  2 high-level libraries (libsodium, Tink, Fernet/AEAD classes)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  3 low-level &quot;hazmat&quot; primitives (expert review)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  X never: home-made algorithms or protocols</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C15-M07-F3. Prefer the highest-level vetted option that meets the</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">need.</text>
</svg>