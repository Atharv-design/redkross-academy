<svg xmlns="http://www.w3.org/2000/svg" width="560" height="237" viewBox="0 0 560 237" role="img" aria-labelledby="t d">
<title id="t">C15-M08-F3: Test coverage map</title>
<desc id="d">Six categories of tests with the specific cases covered in each.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C15-M08-F3  Test coverage map</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  correctness  : roundtrip (fast, default), empty file</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  freshness    : same input -&gt; different output/salt</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  integrity    : ciphertext bit flip, header salt flip</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  authenticity : wrong passphrase</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  robustness   : truncated, wrong magic, KDF bounds (log2n=30)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  interface    : CLI exit codes 0/1/2, hashes equal</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C15-M08-F3. The 11 execution-tested rkcrypt tests grouped by</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">property.</text>
