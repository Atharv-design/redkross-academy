<svg xmlns="http://www.w3.org/2000/svg" width="670" height="255" viewBox="0 0 670 255" role="img" aria-labelledby="t d">
<title id="t">C21-M01-F2: From command to kernel</title>
<desc id="d">Two horizontal chains show the Docker and Kubernetes paths from client to kernel through containerd and runc, with notes on each layer&#x27;s job; below, an image is shown as index, manifest, config and layers, with a tag pointing to a digest.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C21-M01-F2  From command to kernel</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Docker host:   docker CLI --&gt; dockerd --&gt; containerd --&gt; runc --&gt; kernel</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   K8s node:      kubelet --CRI--&gt; containerd / CRI-O --&gt; runc --&gt; kernel</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                     |                     |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                       pulls images, snapshots   reads config.json:</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                       supervises containers     namespaces, cgroups,</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                 caps, seccomp, mounts</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Image:  index --&gt; manifest --&gt; config + layers   (all by sha256 digest)</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           tag &quot;1.0.0&quot; --&gt; (movable pointer) --&gt; digest</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C21-M01-F2. The runtime stack and the content-addressed image model.</text>
</svg>