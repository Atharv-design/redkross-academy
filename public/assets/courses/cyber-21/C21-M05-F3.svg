<svg xmlns="http://www.w3.org/2000/svg" width="653" height="271" viewBox="0 0 653 271" role="img" aria-labelledby="t d">
<title id="t">C21-M05-F3: Two detection layers</title>
<desc id="d">Two columns of example signals, one for the API audit log and one for node sensors, both feeding a SIEM.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C21-M05-F3  Two detection layers</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   API audit log (control plane)      node sensor (data plane)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   - exec / attach / port-forward     - shell in distroless container</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   - secret reads by service accounts - writes to /usr/bin, ld.so.preload</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   - powerful bindings                - outbound to unknown hosts</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   - admission denials                - scanning port 10250 / 2379</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   - token requests                   - token or metadata reads</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            \                              /</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">             +---&gt; SIEM / SOC triage &lt;----+</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C21-M05-F3. The audit log sees API actions; node sensors see what happens</text>
<text x="20" y="239" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">inside containers.</text>
</svg>