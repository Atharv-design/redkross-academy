<svg xmlns="http://www.w3.org/2000/svg" width="628" height="238" viewBox="0 0 628 238" role="img" aria-labelledby="t d">
<title id="t">C21-M04-F2: Escalation routes to watch</title>
<desc id="d">Seven rows, each pairing a permission with the access it effectively provides.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C21-M04-F2  Escalation routes to watch</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   create pods ------------&gt; mount any secret / run as any SA in ns</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   list secrets -----------&gt; read every secret value in scope</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   pods/exec --------------&gt; act as the workload (its token, its data)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   bind / escalate --------&gt; grant roles beyond your own</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   impersonate ------------&gt; act as another user or group</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   serviceaccounts/token --&gt; mint tokens for other identities</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   nodes/proxy ------------&gt; talk to kubelets directly</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C21-M04-F2. Permissions that are effectively more powerful than they look.</text>
</svg>