<svg xmlns="http://www.w3.org/2000/svg" width="636" height="339" viewBox="0 0 636 339" role="img" aria-labelledby="t d">
<title id="t">C21-M01-F1: A container is a restricted process on a shared kernel</title>
<desc id="d">Two boxes labelled container A and container B each list root filesystem, namespaces, cgroups and privilege restrictions; both sit on a single bar labelled one shared Linux kernel.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C21-M01-F1  A container is a restricted process on a shared kernel</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +------------------- host -----------------------------------------+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  container A (process)          container B (process)            |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  +---------------------------+  +---------------------------+    |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  | rootfs: image layers (ro) |  | rootfs: image layers      |    |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  | + writable layer          |  | + writable layer          |    |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  | ns: mnt pid net uts ipc   |  | ns: mnt pid net uts ipc   |    |</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  | cgroup: mem, pids, cpu    |  | cgroup: mem, pids, cpu    |    |</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  | caps / seccomp / user     |  | caps / seccomp / user     |    |</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  +-------------+-------------+  +-------------+-------------+    |</text>
<text x="20" y="213" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |                +-------------+----------------+                  |</text>
<text x="20" y="230" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |                       ONE SHARED LINUX KERNEL                    |</text>
<text x="20" y="247" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +------------------------------------------------------------------+</text>
<text x="20" y="264" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="291" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C21-M01-F1. Isolation is a set of kernel restrictions applied to a process;</text>
<text x="20" y="307" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">every container shares the host kernel.</text>
</svg>