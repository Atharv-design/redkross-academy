<svg xmlns="http://www.w3.org/2000/svg" width="644" height="237" viewBox="0 0 644 237" role="img" aria-labelledby="t d">
<title id="t">C21-M04-F3: Bound token lifecycle</title>
<desc id="d">A timeline from pod creation through token issue and refresh to pod deletion, when the token is rejected.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C21-M04-F3  Bound token lifecycle</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   pod created --&gt; kubelet requests token (aud, exp, bound to pod uid)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">       |              |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">       |              +--&gt; file refreshed before &quot;warnafter&quot; (60 min)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">       |              +--&gt; exp: 60 min, or 1 year if extend-expiration</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">       |                   is on (default true)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   pod deleted --&gt; token rejected: HTTP 401 (lab: 200 before, 401 after)</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C21-M04-F3. A pod-bound token is valid only while its pod exists, whatever</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">its exp claim says.</text>
</svg>