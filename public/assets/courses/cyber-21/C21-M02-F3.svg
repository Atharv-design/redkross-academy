<title id="t">C21-M02-F3: SBOM, VEX and provenance</title>
<desc id="d">A four-row table pairing SBOM, VEX, provenance and signature with the question each answers and an example.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C21-M02-F3  SBOM, VEX and provenance</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   SBOM        &quot;what is inside&quot;      39 components, purls, versions</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   VEX         &quot;is it exploitable?&quot;  supplier statement per CVE</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Provenance  &quot;how was it built?&quot;   builder, Dockerfile, base digest</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Signature   &quot;who vouches?&quot;        binds each statement to the digest</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C21-M02-F3. Four complementary statements about an image.</text>
