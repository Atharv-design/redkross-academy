<svg xmlns="http://www.w3.org/2000/svg" width="661" height="204" viewBox="0 0 661 204" role="img" aria-labelledby="t d">
<title id="t">C21-M08-F1: The hardening loop</title>
<desc id="d">A loop from scope through baseline evidence, prioritisation, change, verification, re-run, report and scheduling back to scope, annotated with the lab scores.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C21-M08-F1  The hardening loop</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   scope --&gt; baseline evidence (2/10) --&gt; prioritise --&gt; change via Git</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     ^                                                       |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |                                                       v</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   schedule &amp; alert &lt;-- report &lt;-- re-run evidence &lt;-- verify each control</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                   (7/10 -&gt; fix -&gt; 10/10)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C21-M08-F1. Measure, change, verify and repeat.</text>
</svg>