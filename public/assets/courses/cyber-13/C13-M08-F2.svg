<svg xmlns="http://www.w3.org/2000/svg" width="594" height="220" viewBox="0 0 594 220" role="img" aria-labelledby="t d">
<title id="t">C13-M08-F2: The evidence arc for legacy-svc</title>
<desc id="d">Before and after states for the legacy-svc finding, with the action between them and the exit code changing from one to zero.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M08-F2  The evidence arc for legacy-svc</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   BEFORE: [HIGH] legacy-svc SPN -&gt; Kerberoastable   (exit=1)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      | action: remove SPN / move to gMSA; disable dormant account</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      v</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   AFTER:  legacy-svc HIGH finding absent             (exit -&gt; 0)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   proof:  saved dir_review.py output, before and after</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M08-F2. One finding, closed and proven, with the exit code as the</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">single-number signal.</text>
</svg>