<svg xmlns="http://www.w3.org/2000/svg" width="661" height="254" viewBox="0 0 661 254" role="img" aria-labelledby="t d">
<title id="t">C13-M03-F1: OU structure for Sahyadri Logistics</title>
<desc id="d">A tree under the domain root showing six organisational units for the three admin tiers, service accounts, workstations and servers.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M03-F1  OU structure for Sahyadri Logistics</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   DC=ad,DC=sahyadri,DC=example</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- OU=Tier0            (domain/forest admin identities)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- OU=Tier1            (server admin identities)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- OU=Tier2            (workstation/help-desk identities, staff)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- OU=ServiceAccounts  (app identities, e.g. legacy-svc + PSO)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- OU=Workstations     (computer accounts; baseline GPO linked here)</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- OU=Servers          (computer accounts)</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M03-F1. OUs organise administration and Group Policy targeting; they are</text>
<text x="20" y="222" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">not security groups.</text>
</svg>