<svg xmlns="http://www.w3.org/2000/svg" width="602" height="254" viewBox="0 0 602 254" role="img" aria-labelledby="t d">
<title id="t">C13-M01-F3: Directory partitions on a domain controller</title>
<desc id="d">A box for one domain controller listing four naming contexts and the SYSVOL share, with notes on which are forest-wide.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M01-F3  Directory partitions on a domain controller</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +------------------- Domain Controller dc1 -------------------+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  Schema NC          (forest-wide: classes and attributes)   |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  Configuration NC   (forest-wide: sites, services)          |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  Domain NC          (this domain: users, computers, groups) |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  Application NCs     (e.g. DomainDnsZones)                   |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  + SYSVOL share      (Group Policy, logon scripts)          |</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +-------------------------------------------------------------+</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M01-F3. A DC holds several partitions; two are forest-wide and one</text>
<text x="20" y="222" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">is specific to its domain.</text>
</svg>