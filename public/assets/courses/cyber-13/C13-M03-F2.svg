<svg xmlns="http://www.w3.org/2000/svg" width="678" height="203" viewBox="0 0 678 203" role="img" aria-labelledby="t d">
<title id="t">C13-M03-F2: AGDLP - keep role and permission separable</title>
<desc id="d">A chain from a user account through a global role group and a domain-local permission group to a resource permission.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M03-F2  AGDLP - keep role and permission separable</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Accounts --&gt; Global group (by role) --&gt; Domain Local group --&gt; Permission</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   asha        G-Helpdesk                  DL-Finance-Read        read share</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     ^ who you are      ^ your role            ^ what it grants</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   review membership here; change permissions there, independently</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M03-F2. Users go into role (global) groups; those go into permission</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">(domain-local) groups granted on resources.</text>
</svg>