<svg xmlns="http://www.w3.org/2000/svg" width="653" height="305" viewBox="0 0 653 305" role="img" aria-labelledby="t d">
<title id="t">C13-M01-F1: Forest, trees, domains and the security boundary</title>
<desc id="d">A large box labelled forest contains two trees, each with a parent domain and a child domain; a note states that true isolation requires a separate forest.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M01-F1  Forest, trees, domains and the security boundary</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +==================== FOREST (security boundary) ====================+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |  shared: schema, configuration, global catalogue, auto trusts     |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |                                                                    |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |   TREE 1                             TREE 2                        |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |   example.com (domain)               sahyadri.example (domain)     |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |      |                                   |                         |</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |      +-- sales.example.com (child)       +-- ad.sahyadri.example   |</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   |                                                                    |</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +====================================================================+</text>
<text x="20" y="213" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     separate isolation  =&gt; separate FOREST, not separate domain</text>
<text x="20" y="230" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="257" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M01-F1. Domains group into trees, trees into a forest; the forest is the</text>
<text x="20" y="273" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">trust and security boundary.</text>
</svg>