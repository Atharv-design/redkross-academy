<svg xmlns="http://www.w3.org/2000/svg" width="678" height="237" viewBox="0 0 678 237" role="img" aria-labelledby="t d">
<title id="t">C13-M05-F1: Precondition -&gt; technique -&gt; control</title>
<desc id="d">A table mapping five findable preconditions to their ATT&amp;CK techniques and the controls that fix each.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M05-F1  Precondition -&gt; technique -&gt; control</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   PRECONDITION (findable)        TECHNIQUE (ATT&amp;CK)     CONTROL (fix)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   SPN on user, weak password  -&gt; Kerberoasting T1558.003 gMSA/long pw, AES</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   pre-auth disabled (0x400000)-&gt; AS-REP roast T1558.004  enable pre-auth</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   krbtgt key stolen           -&gt; Golden ticket T1558.001 protect DC; rotate</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   service key stolen          -&gt; Silver ticket T1558.002 rotate svc key</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   unconstrained deleg (non-DC)-&gt; impersonation          constrained/RBCD</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M05-F1. Every technique has a directory precondition a defender can find and</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">a control that removes it.</text>
</svg>