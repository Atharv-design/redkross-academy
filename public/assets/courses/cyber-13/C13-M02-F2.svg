<svg xmlns="http://www.w3.org/2000/svg" width="670" height="220" viewBox="0 0 670 220" role="img" aria-labelledby="t d">
<title id="t">C13-M02-F2: Which key protects which ticket</title>
<desc id="d">Two mappings showing the TGT protected by the krbtgt key and service tickets by service-account keys, with the two attack consequences named.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M02-F2  Which key protects which ticket</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   TGT            --[encrypted with]--&gt; krbtgt account key   (crown jewel)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   service ticket --[encrypted with]--&gt; service account key  (keep long,</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                               random, AES)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   consequence:   know krbtgt key  =&gt; forge any TGT  (golden ticket)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                  any TGT          =&gt; request any SPN&#x27;s ticket (roasting)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M02-F2. The encryption keys explain why krbtgt and service-account secrets</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">are so sensitive.</text>
</svg>