<svg xmlns="http://www.w3.org/2000/svg" width="628" height="271" viewBox="0 0 628 271" role="img" aria-labelledby="t d">
<title id="t">C13-M02-F1: The Kerberos three-party flow</title>
<desc id="d">A sequence between client, KDC and service showing AS-REQ/REP yielding a TGT, TGS-REQ/REP yielding a service ticket, and AP-REQ presenting it to the service.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M02-F1  The Kerberos three-party flow</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   CLIENT                         KDC (on the DC)              SERVICE</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |  1 AS-REQ (pre-auth) -------&gt;  AS                         |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |  2 AS-REP (TGT + sess key) &lt;--  (TGT enc. w/ krbtgt key)  |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |  3 TGS-REQ (TGT + SPN) -----&gt;  TGS                        |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |  4 TGS-REP (service ticket) &lt;-- (enc. w/ service key)     |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |  5 AP-REQ (service ticket) ------------------------------&gt;|</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |                                        service decrypts   |</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |                                        with its own key   |</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M02-F1. The TGT is encrypted with the krbtgt key; each service ticket</text>
<text x="20" y="239" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">with that service&#x27;s key. The password is used only at step 1.</text>
</svg>