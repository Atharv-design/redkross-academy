<svg xmlns="http://www.w3.org/2000/svg" width="661" height="187" viewBox="0 0 661 187" role="img" aria-labelledby="t d">
<title id="t">C13-M06-F3: Alert investigation flow</title>
<desc id="d">Five stages from scoping an alert through baselining, corroboration and a decision to recording the evidence.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M06-F3  Alert investigation flow</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   alert --&gt; SCOPE --&gt; BASELINE --&gt; CORROBORATE --&gt; DECIDE --&gt; RECORD</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">             who/     is this      related         benign/    evidence for</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">             where/   normal for   events (TGT,    suspicious/ report + IR</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">             when/#   this acct?   lockout, chg)   confirmed</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M06-F3. A repeatable path from a single alert to a documented conclusion.</text>
</svg>