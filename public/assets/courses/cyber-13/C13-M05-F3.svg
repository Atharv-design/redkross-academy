<svg xmlns="http://www.w3.org/2000/svg" width="653" height="220" viewBox="0 0 653 220" role="img" aria-labelledby="t d">
<title id="t">C13-M05-F3: The legacy-svc exemplar - three findings at once</title>
<desc id="d">The legacy-svc account annotated with its three findings and their severities and the combined fix.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M05-F3  The legacy-svc exemplar - three findings at once</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   legacy-svc</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- servicePrincipalName HTTP/app1...  -&gt; Kerberoastable  [HIGH]</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- UAC 0x10000 (never expire)         -&gt; stale secret    [MEDIUM]</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- lastLogon 0 (never used)           -&gt; dormant         [LOW]</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   one account, three closable weaknesses; fix = gMSA or remove + disable</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M05-F3. A single real account carrying three findings, as the lab review</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">reported.</text>
</svg>