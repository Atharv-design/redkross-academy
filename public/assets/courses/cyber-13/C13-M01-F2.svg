<svg xmlns="http://www.w3.org/2000/svg" width="619" height="203" viewBox="0 0 619 203" role="img" aria-labelledby="t d">
<title id="t">C13-M01-F2: How a client finds and uses a domain controller</title>
<desc id="d">A client first queries DNS for the LDAP SRV record, receives the DC name, then contacts the DC for Kerberos on port 88 and LDAP on port 389.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M01-F2  How a client finds and uses a domain controller</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   client ---(1 DNS SRV: _ldap._tcp.ad.sahyadri.example)--&gt; DNS</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   client &lt;--(2 &quot;dc1.ad.sahyadri.example&quot;)------------------ DNS</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   client ---(3 Kerberos AS/TGS on 88)--------------------&gt; DC (KDC)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   client ---(4 LDAP search/bind on 389)------------------&gt; DC (LDAP)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M01-F2. DNS locates the DC; Kerberos authenticates; LDAP reads the</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">directory. Break DNS and all of this fails.</text>
</svg>