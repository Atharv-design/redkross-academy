<svg xmlns="http://www.w3.org/2000/svg" width="678" height="254" viewBox="0 0 678 254" role="img" aria-labelledby="t d">
<title id="t">C13-M06-F1: Key identity event IDs (Windows) and the lab mapping</title>
<desc id="d">A table of Windows Security event IDs with their meanings and the corresponding fields in the lab JSON audit stream.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C13-M06-F1  Key identity event IDs (Windows) and the lab mapping</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Windows ID  meaning                         lab JSON field</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   4624        logon success                   eventId 4624, status OK</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   4625/4771   logon/pre-auth failure          status WRONG_PASSWORD etc.</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   4768/4769   TGT / service-ticket request    (Windows adds; lab: KDC desc)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   4672        special privileges (admin)       Tier 0 account in summary</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   4740        account lockout                  correlate with bursts</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   1102        security log cleared             (forward off-host!)</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C13-M06-F1. The events that matter for identity, and how the lab&#x27;s JSON stream</text>
<text x="20" y="222" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">maps to them.</text>
</svg>