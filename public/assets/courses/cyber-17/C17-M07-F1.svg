<svg xmlns="http://www.w3.org/2000/svg" width="670" height="170" viewBox="0 0 670 170" role="img" aria-labelledby="t d">
<title id="t">C17-M07-F1: Third-party lifecycle</title>
<desc id="d">A sequence from identifying the need through tiering, due diligence, contracting, onboarding and monitoring to renewal or exit.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C17-M07-F1  Third-party lifecycle</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  identify need -&gt; tier (inherent risk) -&gt; due diligence -&gt; contract</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     -&gt; onboard (access, integration) -&gt; monitor (periodic + triggers)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     -&gt; incident handling as needed -&gt; renew or exit (data return/deletion)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C17-M07-F1. Third-party risk management across the relationship.</text>
</svg>