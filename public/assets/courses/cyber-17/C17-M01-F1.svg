<svg xmlns="http://www.w3.org/2000/svg" width="661" height="204" viewBox="0 0 661 204" role="img" aria-labelledby="t d">
<title id="t">C17-M01-F1: Governance, management and operations</title>
<desc id="d">Three stacked levels (board, executives and CISO, operations) with direction flowing downward and reporting flowing upward.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C17-M01-F1  Governance, management and operations</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  BOARD / COMMITTEES  -- direction, risk appetite, oversight --+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          |                                                    |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  EXECUTIVES / CISO   -- plans, standards, resources, reporting |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          |                                                    | reporting</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  OPERATIONS / OWNERS -- run controls, evidence, incidents ----+ upward</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C17-M01-F1. Direction flows down; evidence and reporting flow up.</text>
</svg>