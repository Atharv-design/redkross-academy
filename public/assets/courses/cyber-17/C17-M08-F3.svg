<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  courier API 12h &gt; 8h     -&gt; workaround or second provider</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  4 leavers active         -&gt; automate deprovisioning (high finding)</text>
