<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                       |  GOVERN   |  (GV: 6 categories)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                       +-----------+</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     IDENTIFY (3) -&gt; PROTECT (5) -&gt; DETECT (2) -&gt; RESPOND (4) -&gt; RECOVER (2)</text>
