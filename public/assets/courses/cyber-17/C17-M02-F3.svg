<svg xmlns="http://www.w3.org/2000/svg" width="670" height="238" viewBox="0 0 670 238" role="img" aria-labelledby="t d">
<title id="t">C17-M02-F3: Treatment decision</title>
<desc id="d">A decision flow leading to accept, mitigate, transfer, or avoid and escalate, depending on appetite, cost-effective controls and transferability.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C17-M02-F3  Treatment decision</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  residual within appetite? --yes--&gt; accept (owner, rationale, expiry)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          | no</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  cost-effective control? --yes--&gt; mitigate (plan, owner, date)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          | no</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  can liability be shifted? --yes--&gt; transfer (+ residual ops risk remains)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          | no</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  avoid (stop activity) or escalate for exceptional acceptance</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C17-M02-F3. Choosing a risk treatment.</text>
</svg>