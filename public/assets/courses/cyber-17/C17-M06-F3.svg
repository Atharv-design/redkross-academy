<svg xmlns="http://www.w3.org/2000/svg" width="644" height="170" viewBox="0 0 644 170" role="img" aria-labelledby="t d">
<title id="t">C17-M06-F3: Anatomy of a finding</title>
<desc id="d">A sequence from condition and criteria through cause, effect, recommendation and rating to the management response.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C17-M06-F3  Anatomy of a finding</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  CONDITION (what is) vs CRITERIA (what should be)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        -&gt; CAUSE (why) -&gt; EFFECT (so what, risk link)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        -&gt; RECOMMENDATION -&gt; RATING -&gt; MANAGEMENT RESPONSE (owner, date)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C17-M06-F3. The elements of a well-formed audit finding.</text>
</svg>