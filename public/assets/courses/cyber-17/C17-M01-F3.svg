<svg xmlns="http://www.w3.org/2000/svg" width="527" height="271" viewBox="0 0 527 271" role="img" aria-labelledby="t d">
<title id="t">C17-M01-F3: Policy hierarchy</title>
<desc id="d">A four-level hierarchy from policy to guideline, with approval and review notes and a link to the exception register.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C17-M01-F3  Policy hierarchy</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  POLICY        intent; board/exec approved; annual review</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  STANDARD      mandatory specifics; CISO/forum approved</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  PROCEDURE     how-to; team owned</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  GUIDELINE     recommended practice; optional</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  exceptions -&gt; exception register (Module 4)</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C17-M01-F3. Policy, standards, procedures and guidelines,</text>
<text x="20" y="239" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">with approval levels.</text>
</svg>