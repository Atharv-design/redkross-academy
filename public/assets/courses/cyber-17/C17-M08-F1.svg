<svg xmlns="http://www.w3.org/2000/svg" width="628" height="288" viewBox="0 0 628 288" role="img" aria-labelledby="t d">
<title id="t">C17-M08-F1: How the GRC artefacts connect</title>
<desc id="d">Inputs from assets, threats, control tests, exceptions, audit findings and vendor assessments feed the risk register, which with the policy pack informs the management review, producing decisions and an improvement plan that loops back.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C17-M08-F1  How the GRC artefacts connect</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  assets/BIA --&gt; RISK REGISTER &lt;-- threats/incidents</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                    ^    ^    ^</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">       control tests |    |    | vendor assessments</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                     |    |    |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">               exceptions  audit findings</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                    |</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  POLICY PACK (policy -&gt; standards -&gt; procedures, traceability matrix)</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                    |</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  MANAGEMENT REVIEW -&gt; decisions -&gt; improvement plan -&gt; (back to all)</text>
<text x="20" y="213" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="240" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C17-M08-F1. The risk register integrates inputs; the policy pack and</text>
<text x="20" y="256" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">management review drive decisions and improvement.</text>
</svg>