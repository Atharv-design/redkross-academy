<svg xmlns="http://www.w3.org/2000/svg" width="518" height="237" viewBox="0 0 518 237" role="img" aria-labelledby="t d">
<title id="t">C11-M01-F1: Shared responsibility by service model</title>
<desc id="d">A table of five layers against three service models showing which are customer or provider duties.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M01-F1  Shared responsibility by service model</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                  IaaS        PaaS        SaaS</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  data/identity   CUSTOMER    CUSTOMER    CUSTOMER</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  application     CUSTOMER    shared      provider</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  OS/runtime      CUSTOMER    provider    provider</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  network rules   CUSTOMER    CUSTOMER    tenant settings</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  hypervisor/DC   provider    provider    provider</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M01-F1. Customer duties shrink from IaaS to SaaS, but</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">data and identity always remain.</text>
</svg>