<svg xmlns="http://www.w3.org/2000/svg" width="628" height="221" viewBox="0 0 628 221" role="img" aria-labelledby="t d">
<title id="t">C11-M03-F2: IMDSv2 session flow</title>
<desc id="d">A process obtains a token with PUT and uses it for metadata requests; requests without a token, PUTs with forwarding headers, and extra hops are rejected.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M03-F2  IMDSv2 session flow</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  process on instance --PUT /latest/api/token (TTL &lt;= 6 h)--&gt; IMDS</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                       &lt;--------------- token ------------------</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                       --GET metadata + token header----------&gt; IMDS</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  request without token (IMDSv2 required)  -&gt; 401</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  PUT with X-Forwarded-For                  -&gt; rejected</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  hop limit 1                               -&gt; token cannot leave host</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M03-F2. IMDSv2 requires a session token obtained with PUT.</text>
</svg>