<svg xmlns="http://www.w3.org/2000/svg" width="510" height="186" viewBox="0 0 510 186" role="img" aria-labelledby="t d">
<title id="t">C11-M04-F3: Versioning recovery (lab)</title>
<desc id="d">Three steps: an object version, a delete marker hiding it, and removal of the marker restoring it.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M04-F3  Versioning recovery (lab)</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  put object      -&gt; version v1</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  delete object   -&gt; delete marker (GET -&gt; NoSuchKey)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  remove marker   -&gt; v1 current again (content restored)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M04-F3. Versioning turns deletion into a reversible</text>
<text x="20" y="154" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">event.</text>
</svg>