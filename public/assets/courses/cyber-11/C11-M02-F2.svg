<svg xmlns="http://www.w3.org/2000/svg" width="728" height="187" viewBox="0 0 728 187" role="img" aria-labelledby="t d">
<title id="t">C11-M02-F2: The MFA condition-key trap (lab)</title>
<desc id="d">A table of three request types showing that the Bool form does not deny access-key requests while BoolIfExists does.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M02-F2  The MFA condition-key trap (lab)</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  request type         aws:MultiFactorAuthPresent   Bool deny   BoolIfExists deny</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  console with MFA     true                         no match    no match  -&gt; allow</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  console no MFA       false                        DENY        DENY</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  long-term access key (absent)                     no match!   DENY</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M02-F2. With Bool, access-key requests escape the MFA deny.</text>
</svg>