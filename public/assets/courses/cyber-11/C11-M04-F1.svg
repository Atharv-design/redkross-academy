<svg xmlns="http://www.w3.org/2000/svg" width="636" height="204" viewBox="0 0 636 204" role="img" aria-labelledby="t d">
<title id="t">C11-M04-F1: Layers of storage access</title>
<desc id="d">A request passes public-access overrides, identity permissions, resource policies and key permissions before reaching data.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M04-F1  Layers of storage access</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  request -&gt; Block Public Access / anonymous access disabled (override)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          -&gt; identity policy / RBAC data role</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          -&gt; bucket policy / container settings (+ network conditions)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          -&gt; KMS key policy (kms:Decrypt) for SSE-KMS objects</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          -&gt; data</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M04-F1. Several independent checks guard cloud data.</text>
</svg>