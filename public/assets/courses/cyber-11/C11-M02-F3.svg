<svg xmlns="http://www.w3.org/2000/svg" width="602" height="204" viewBox="0 0 602 204" role="img" aria-labelledby="t d">
<title id="t">C11-M02-F3: Layers that bound privilege</title>
<desc id="d">Nested layers from organisation guardrails down to resource policies, with effective permissions as their intersection.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M02-F3  Layers that bound privilege</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  Organisation guardrails (SCP / Azure Policy)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">    &gt; permission boundary / PIM eligibility</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      &gt; identity policy or role assignment</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        &gt; resource policy / session policy</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  effective permission = intersection of the allows, minus any deny</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M02-F3. Each layer can only reduce what the next grants.</text>
</svg>