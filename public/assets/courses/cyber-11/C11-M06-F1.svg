<svg xmlns="http://www.w3.org/2000/svg" width="670" height="204" viewBox="0 0 670 204" role="img" aria-labelledby="t d">
<title id="t">C11-M06-F1: Where configuration is checked</title>
<desc id="d">Configuration is checked in pull requests, at deployment by guardrails, continuously in the live cloud and by drift detection; findings flow to a queue and back into code.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M06-F1  Where configuration is checked</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  developer -&gt; pull request: IaC + secret scan (gate)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            -&gt; pipeline apply (guardrails: SCP / Azure Policy deny)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            -&gt; live cloud: CSPM / Config / Defender (continuous)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            -&gt; drift detection vs IaC state</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  findings -&gt; queue (owner, severity, SLA) -&gt; fix in code -&gt; re-scan + test</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M06-F1. Prevent in code, block at deployment, detect continuously.</text>
</svg>