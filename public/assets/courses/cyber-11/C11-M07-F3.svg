<svg xmlns="http://www.w3.org/2000/svg" width="577" height="187" viewBox="0 0 577 187" role="img" aria-labelledby="t d">
<title id="t">C11-M07-F3: Workload defence layers</title>
<desc id="d">Four stages of workload controls.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M07-F3  Workload defence layers</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  build:   minimal image, scan, sign, no secrets</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  deploy:  digest, least-privilege role, private network</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  run:     runtime monitoring, egress control, immutable replace</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  observe: logs + findings -&gt; SIEM; credential-use anomalies</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M07-F3. Controls at build, deploy, run and observe.</text>
</svg>