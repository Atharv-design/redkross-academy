<svg xmlns="http://www.w3.org/2000/svg" width="602" height="254" viewBox="0 0 602 254" role="img" aria-labelledby="t d">
<title id="t">C11-M03-F1: Workload VPC</title>
<desc id="d">Internet traffic enters a WAF and load balancer in public subnets, reaches app instances in private subnets and a database in data subnets; services are reached via private endpoints; outbound traffic passes a NAT and firewall.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M03-F1  Workload VPC</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  internet -&gt; [WAF + ALB]  public subnets (route 0.0.0.0/0 -&gt; igw)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                  |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">             [app instances] private subnets, IMDSv2, no public IPs</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                  |  sg-ref 5432</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">             [database]     data subnets, no gateway route</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  app -&gt; S3 gateway endpoint / KMS interface endpoint (no internet)</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  app -&gt; NAT -&gt; network firewall (allowlist) -&gt; internet</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M03-F1. Public entry through WAF and load balancer; private tiers;</text>
<text x="20" y="222" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">private endpoints; filtered egress.</text>
</svg>