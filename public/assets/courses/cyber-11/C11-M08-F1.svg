<svg xmlns="http://www.w3.org/2000/svg" width="686" height="221" viewBox="0 0 686 221" role="img" aria-labelledby="t d">
<title id="t">C11-M08-F1: Cloud incident workflow</title>
<desc id="d">Six stages from preparation to lessons learned.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M08-F1  Cloud incident workflow</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  prepare (IR roles, logs, forensic acct, runbooks)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     -&gt; detect/analyse (identity, control plane, data, network; UTC timeline)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     -&gt; contain (keys, sessions, roles; quarantine SG)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     -&gt; preserve (snapshots, log exports, tags, hashes)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     -&gt; eradicate + recover (rebuild from IaC, restore isolated backups)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     -&gt; lessons learned (guardrails, detections, runbooks)</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M08-F1. The response life cycle adapted to the cloud.</text>
