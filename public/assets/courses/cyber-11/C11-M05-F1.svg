<svg xmlns="http://www.w3.org/2000/svg" width="678" height="204" viewBox="0 0 678 204" role="img" aria-labelledby="t d">
<title id="t">C11-M05-F1: Cloud logging architecture</title>
<desc id="d">AWS, Azure, identity and network logs flow to a protected archive and SIEM, joined by native detection findings into one triage queue.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C11-M05-F1  Cloud logging architecture</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  AWS accounts --org trail + data events--&gt; log-archive bucket (Object Lock)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  Azure subs --diagnostic settings (Policy)--&gt; central workspace + archive</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  Entra / M365 --sign-in, audit, Purview--&gt; SIEM</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  VPC/VNet flow, firewall, DNS -----------&gt; SIEM</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  native detection (GuardDuty, Defender) --&gt; SIEM -&gt; triage queue</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C11-M05-F1. Every source to protected central storage and one triage queue.</text>
</svg>