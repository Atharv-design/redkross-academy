<svg xmlns="http://www.w3.org/2000/svg" width="619" height="221" viewBox="0 0 619 221" role="img" aria-labelledby="t d">
<title id="t">C10-M05-F1: Anatomy of a YARA rule</title>
<desc id="d">The three parts of a YARA rule - meta, strings with identifiers, and a boolean condition.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C10-M05-F1  Anatomy of a YARA rule</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   rule NAME {</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     meta:      author/description/reference   (documentation)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     strings:   $a = &quot;text&quot;   $b = { DE AD BE EF }   $c = &quot;wide&quot; wide</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     condition: all of them | any of them | N of them</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   }</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   matches a file when the condition is true over the strings found</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C10-M05-F1. A YARA rule: meta, strings and a condition [C10-M05-R1].</text>
</svg>