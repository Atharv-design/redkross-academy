<svg xmlns="http://www.w3.org/2000/svg" width="653" height="220" viewBox="0 0 653 220" role="img" aria-labelledby="t d">
<title id="t">C10-M02-F3: Containment in the lab harness</title>
<desc id="d">The behaviour harness creating a sandbox and loopback sink, running the simulator, capturing events and discarding the sandbox.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C10-M02-F3  Containment in the lab harness</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   behaviour.py:</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     create throwaway sandbox dir   &lt;- only place the simulator may write</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     bind loopback sink 127.0.0.1   &lt;- only place it may connect</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     run rksim.py in the sandbox</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     capture events, then DISCARD the sandbox   &lt;- detonate-and-revert</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C10-M02-F3. The dynamic harness contains and reverts, mirroring VM snapshot</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">discipline.</text>
</svg>