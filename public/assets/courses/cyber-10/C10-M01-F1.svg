<svg xmlns="http://www.w3.org/2000/svg" width="644" height="237" viewBox="0 0 644 237" role="img" aria-labelledby="t d">
<title id="t">C10-M01-F1: Malware categories by behaviour</title>
<desc id="d">Malware categories grouped by behaviour - replication, disguise, access, payload and delivery - with the note that real samples combine several.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C10-M01-F1  Malware categories by behaviour</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   replication : virus (infects files) | worm (self-spreads on networks)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   disguise    : trojan (hidden in benign) | rootkit (hides itself)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   access      : backdoor | bot/RAT (remote control)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   payload     : ransomware (encrypts) | spyware/infostealer (collects)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   delivery    : downloader (pulls payload) | dropper (carries payload)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   note: real malware usually combines several of these</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C10-M01-F1. Malware categories are behaviours; samples combine them</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">[C10-M01-R1].</text>
</svg>