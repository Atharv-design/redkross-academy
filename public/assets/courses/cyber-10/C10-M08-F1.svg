<svg xmlns="http://www.w3.org/2000/svg" width="670" height="237" viewBox="0 0 670 237" role="img" aria-labelledby="t d">
<title id="t">C10-M08-F1: The malware report structure</title>
<desc id="d">The eight sections of a malware report, led by the classification, with every claim traceable to evidence.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C10-M08-F1  The malware report structure</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   1 subject + provenance (file, hashes, source)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   2 classification: verdict + CONFIDENCE + LIMITATIONS   &lt;- lead with this</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   3 static findings   4 dynamic findings</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   5 IOCs   6 detection coverage (validated)   7 defensive recommendations</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   8 handling/limitations statement</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   every claim -&gt; traceable evidence</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C10-M08-F1. A report structure that serves every reader, led by the</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">classification [C10-M08-R1].</text>
</svg>