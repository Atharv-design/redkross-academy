<svg xmlns="http://www.w3.org/2000/svg" width="703" height="237" viewBox="0 0 703 237" role="img" aria-labelledby="t d">
<title id="t">C10-M05-F3: The pyramid of pain</title>
<desc id="d">The pyramid of pain from hashes at the bottom to TTPs at the top, with the guidance to invest in higher, more durable detections.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C10-M05-F3  The pyramid of pain</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   TTPs/behaviours      (hardest to change - most durable)   ^ invest effort up</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   tools                                                      |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   network/host artefacts (mutex, path, User-Agent)          |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   domain names                                              |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   IP addresses                                              |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   hash values          (trivial to change - least durable)  |</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C10-M05-F3. Indicators higher on the pyramid of pain are more durable detections</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">[C10-M05-R2].</text>
</svg>