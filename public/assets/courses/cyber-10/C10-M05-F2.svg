<svg xmlns="http://www.w3.org/2000/svg" width="636" height="203" viewBox="0 0 636 203" role="img" aria-labelledby="t d">
<title id="t">C10-M05-F2: Validating a detection (both sides)</title>
<desc id="d">Validation requiring a rule to match the target and not match clean files, with the lab&#x27;s passing result.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C10-M05-F2  Validating a detection (both sides)</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   rule --&gt; scan target sample(s)  -&gt; MUST match      (true positives)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        --&gt; scan clean-file corpus -&gt; MUST NOT match  (false positives)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   tighten until: catches target + variants, zero benign matches</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   lab: 3 rules match specimen; 0 match clean_sample.txt</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C10-M05-F2. A rule is validated on both the true-positive and</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">false-positive sides [C10-M05-R2].</text>
</svg>