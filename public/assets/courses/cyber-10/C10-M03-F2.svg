<svg xmlns="http://www.w3.org/2000/svg" width="720" height="187" viewBox="0 0 720 187" role="img" aria-labelledby="t d">
<title id="t">C10-M03-F2: The PE format at a glance</title>
<desc id="d">The PE layout from the MZ header through the PE headers, section table and import directory.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C10-M03-F2  The PE format at a glance</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   [MZ DOS header]--e_lfanew--&gt;[PE\0\0][COFF header][optional header + data dirs]</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   [section table: .text(code,XR) .rdata(RO,R) .data(RW) .rsrc]</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   data dir -&gt; import table -&gt; DLL -&gt; function names (capability)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   addresses as RVAs from image base; RVA-&gt;offset via section table</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C10-M03-F2. PE structure: headers, sections and the import directory [C10-M03-R2].</text>
</svg>