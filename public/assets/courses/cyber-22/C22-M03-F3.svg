<svg xmlns="http://www.w3.org/2000/svg" width="560" height="221" viewBox="0 0 560 221" role="img" aria-labelledby="t d">
<title id="t">C22-M03-F3: Policy decision flow (lab model)</title>
<desc id="d">A sequence of checks leading to deny, step-up or allow, ending with logging of reasons.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M03-F3  Policy decision flow (lab model)</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  known resource? -no-&gt; DENY</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  entitled? -no-&gt; DENY</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  device rule ok? -no-&gt; DENY</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  risk high? -yes-&gt; DENY</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  auth strength &gt;= required (+1 if medium risk)? -no-&gt; STEP_UP</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  -&gt; ALLOW (log reasons)</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M03-F3. The order of checks in zt_pdp.py (execution-tested).</text>
</svg>