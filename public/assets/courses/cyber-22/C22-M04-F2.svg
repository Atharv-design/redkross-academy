<svg xmlns="http://www.w3.org/2000/svg" width="594" height="204" viewBox="0 0 594 204" role="img" aria-labelledby="t d">
<title id="t">C22-M04-F2: Gateway patterns</title>
<desc id="d">Five access paths for users, admins, legacy systems and partners, each through an appropriate gateway type.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M04-F2  Gateway patterns</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  users --(IdP SSO)--&gt; SaaS</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  users --&gt; identity-aware proxy / ZTNA (PEP) --&gt; private web apps</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  admins --&gt; bastion (MFA, JIT, recording) --&gt; servers</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  legacy/OT --&gt; enclave gateway --&gt; isolated segment</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  partners --&gt; API gateway (tokens, HMAC, rate limit) --&gt; APIs</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M04-F2. Access patterns chosen by user type and resource.</text>
</svg>