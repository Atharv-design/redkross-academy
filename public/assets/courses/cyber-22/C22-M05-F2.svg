<svg xmlns="http://www.w3.org/2000/svg" width="661" height="187" viewBox="0 0 661 187" role="img" aria-labelledby="t d">
<title id="t">C22-M05-F2: Key custody separation</title>
<desc id="d">Four roles with distinct permissions: key administrators, workload role, data administrators and audit logging.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M05-F2  Key custody separation</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  key admins (sec-keys)  -&gt; manage key policy, rotation   (no data access)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  workload role          -&gt; Encrypt / Decrypt (scoped by context)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  data admins (app-ops)  -&gt; manage DB                    (no key admin)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  audit                  -&gt; all key use logged to SIEM</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M05-F2. No single role can both manage keys and read data.</text>
</svg>