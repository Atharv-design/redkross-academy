<svg xmlns="http://www.w3.org/2000/svg" width="628" height="204" viewBox="0 0 628 204" role="img" aria-labelledby="t d">
<title id="t">C22-M06-F2: Failure modes by sensitivity</title>
<desc id="d">A table mapping four sensitivity levels to failure modes and safeguards.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M06-F2  Failure modes by sensitivity</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  resource sensitivity   PDP unreachable -&gt;   safeguard</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  restricted             fail closed           break-glass + alert</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  confidential           fail closed           break-glass</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  internal               cached (&lt;= 15 min)    alert on fail-safe path</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  public                 fail open             alert, short duration</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M06-F2. The failure mode is chosen per resource class.</text>
</svg>