<svg xmlns="http://www.w3.org/2000/svg" width="577" height="204" viewBox="0 0 577 204" role="img" aria-labelledby="t d">
<title id="t">C22-M07-F2: Evidence strength ladder</title>
<desc id="d">Five levels of evidence from a document statement (weakest) to automated repeated tests in production (strongest).</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M07-F2  Evidence strength ladder</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  5  automated, repeated test of effect in production (retained)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  4  test of effect in a representative environment</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  3  configuration export checked by a tool</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  2  configuration screenshot</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  1  statement in a document</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M07-F2. Prefer evidence higher on the ladder.</text>
</svg>