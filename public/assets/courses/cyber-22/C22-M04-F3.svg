<svg xmlns="http://www.w3.org/2000/svg" width="653" height="186" viewBox="0 0 653 186" role="img" aria-labelledby="t d">
<title id="t">C22-M04-F3: Assume-breach view of an edge appliance</title>
<desc id="d">An edge appliance connected only to a segmented landing zone, with internal applications still requiring identity verification.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M04-F3  Assume-breach view of an edge appliance</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  internet --&gt; [ VPN / portal appliance ] --X--&gt; no implicit trust</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                         |                      internal apps require IdP</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                         +--&gt; segmented landing zone only + logged</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M04-F3. Even if the edge device is compromised, what it can reach is</text>
<text x="20" y="154" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">limited and internal access still requires identity verification.</text>
</svg>