<svg xmlns="http://www.w3.org/2000/svg" width="686" height="237" viewBox="0 0 686 237" role="img" aria-labelledby="t d">
<title id="t">C22-M02-F1: Identity control plane</title>
<desc id="d">HR provisions the IdP, which receives device posture, applies conditional access and issues tokens to applications, gateways and consoles, sending logs to the SIEM.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M02-F1  Identity control plane</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  HR (system of record) --SCIM--&gt; IdP &lt;--- device posture (MDM/EDR)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                   |  conditional access (user, device, risk)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           tokens (OIDC/SAML)      v</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  SaaS apps   internal apps   ZTNA gateway   cloud console (via PAM/JIT)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                   |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                         sign-in + audit logs --&gt; SIEM (180 d)</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M02-F1. The IdP evaluates identity, device and risk signals and issues tokens</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">to every application.</text>
</svg>