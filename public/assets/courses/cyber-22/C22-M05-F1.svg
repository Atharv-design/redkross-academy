<svg xmlns="http://www.w3.org/2000/svg" width="720" height="187" viewBox="0 0 720 187" role="img" aria-labelledby="t d">
<title id="t">C22-M05-F1: Encryption layers</title>
<desc id="d">A request path from client through service to database with transport encryption, field-level encryption and storage encryption, labelled with the threats each addresses.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M05-F1  Encryption layers</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  client --TLS/mTLS--&gt; service --(field-level FLE with CMK)--&gt; database</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                        |  platform encryption</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                        v  at rest (disk/storage)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  threats covered: network sniffing | DB admin/backup theft | media theft</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M05-F1. Transport, field-level and storage encryption address different threats.</text>
</svg>