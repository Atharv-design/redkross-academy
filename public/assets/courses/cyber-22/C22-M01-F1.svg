<svg xmlns="http://www.w3.org/2000/svg" width="661" height="220" viewBox="0 0 661 220" role="img" aria-labelledby="t d">
<title id="t">C22-M01-F1: Tamarind trust zones</title>
<desc id="d">Zones from the internet through edge, apps and data, with partners, staff devices, CI/CD and the management plane connecting at defined boundaries.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M01-F1  Tamarind trust zones</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  Z0 internet --&gt; [Z1 edge: WAF, API GW, ZTNA] --&gt; [Z2 apps] --&gt; [Z3 data]</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        ^                     ^                         ^</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  Z6 partners          Z5 staff devices         CI/CD (signed deploys)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                              |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                       [Z4 management plane: IdP admin, cloud console]</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M01-F1. Trust zones and the boundaries between them for the shipment</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">platform.</text>
</svg>