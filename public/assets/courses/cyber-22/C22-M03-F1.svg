<svg xmlns="http://www.w3.org/2000/svg" width="712" height="221" viewBox="0 0 712 221" role="img" aria-labelledby="t d">
<title id="t">C22-M03-F1: NIST SP 800-207 logical components</title>
<desc id="d">Inputs feed a policy decision point made of a policy engine and policy administrator, which commands an enforcement point between the subject and the resource.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M03-F1  NIST SP 800-207 logical components</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            +------------------- PDP --------------------+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  inputs -&gt; | Policy Engine (decide) -&gt; Policy Administrator (set up/tear down)|</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  (IdM, CDM, +------------------------------|-------------+</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   threat intel, logs, PKI)                 v commands</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  subject (user/device) --&gt; [ PEP ] ----------------------&gt; resource</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                            enable / monitor / terminate</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M03-F1. The PE decides, the PA configures the path, the PEP enforces [C22-M03-R1].</text>
</svg>