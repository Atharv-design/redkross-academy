<svg xmlns="http://www.w3.org/2000/svg" width="628" height="254" viewBox="0 0 628 254" role="img" aria-labelledby="t d">
<title id="t">C22-M04-F1: Lab segmentation</title>
<desc id="d">Two networks, with the app container attached to both; web reaches app, app reaches db, web cannot reach db by name or IP, and db cannot reach the internet.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C22-M04-F1  Lab segmentation</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   tl-front                     tl-data (--internal, no default route)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  +---------------------+      +------------------------+</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  | tl-web    tl-app ---+------+- tl-app      tl-db      |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  |   |  8080 ^         |      |    5432 ^              |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  |   +-------+  OK     |      |   app-&gt;db OK           |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  +---------------------+      +------------------------+</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   web -&gt; db: name FAIL, IP FAIL;  db -&gt; internet: no route</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C22-M04-F1. The application container bridges two networks; the web tier</text>
<text x="20" y="222" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">cannot reach the data tier and the data tier has no egress (execution-tested).</text>
</svg>