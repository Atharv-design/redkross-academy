<svg xmlns="http://www.w3.org/2000/svg" width="544" height="271" viewBox="0 0 544 271" role="img" aria-labelledby="t d">
<title id="t">C20-M05-F1: The PEAK hunting cycle</title>
<desc id="d">Three boxes in a cycle - Prepare, Execute and Act - with a return arrow labelled knowledge.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C20-M05-F1  The PEAK hunting cycle</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        +-----------+      +-----------+      +-----------+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |  PREPARE  | ---&gt; |  EXECUTE  | ---&gt; |    ACT    |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        | topic,    |      | gather,   |      | document, |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        | research, |      | analyse,  |      | automate, |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        | hypothesis|      | validate  |      | communicate|</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        +-----------+      +-----------+      +-----------+</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">              ^                                     |</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">              +---------- KNOWLEDGE (all phases) ---+</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C20-M05-F1. Prepare, Execute and Act, with knowledge throughout</text>
<text x="20" y="239" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">[C20-M05-R2].</text>
</svg>