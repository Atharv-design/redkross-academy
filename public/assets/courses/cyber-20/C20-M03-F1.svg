<svg xmlns="http://www.w3.org/2000/svg" width="653" height="238" viewBox="0 0 653 238" role="img" aria-labelledby="t d">
<title id="t">C20-M03-F1: The network telemetry stack</title>
<desc id="d">A stack with DNS at the bottom, flow in the middle and packets at the top, with cost rising upwards and notes on where each is collected.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C20-M03-F1  The network telemetry stack</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   cost ^   PACKETS   content (if unencrypted), protocol detail</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |             -&gt; chokepoints, on demand, IDS</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |   FLOW      who-whom-port-bytes-duration</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |             -&gt; always on at boundaries and cloud VPCs</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |   DNS       names, types, response codes</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |             -&gt; always on at resolvers</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        +------------------------------------------&gt; visibility of intent</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="206" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C20-M03-F1. Three layers of network telemetry by cost and what they reveal.</text>
</svg>