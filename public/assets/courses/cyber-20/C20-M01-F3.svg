<svg xmlns="http://www.w3.org/2000/svg" width="602" height="221" viewBox="0 0 602 221" role="img" aria-labelledby="t d">
<title id="t">C20-M01-F3: Six questions for every telemetry source</title>
<desc id="d">A six-row checklist: what, where, how, how long, when and trust, each with a short description.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C20-M01-F3  Six questions for every telemetry source</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WHAT      events and fields</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WHERE     share of fleet (n / N), not &quot;yes&quot;</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   HOW       transport, buffering, health check</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   HOW LONG  hot and cold retention vs legal and investigative need</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WHEN      clock sync and time zone (UTC preferred)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   TRUST     who can alter or delete; tamper detection</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C20-M01-F3. A checklist for telemetry specifications.</text>
</svg>