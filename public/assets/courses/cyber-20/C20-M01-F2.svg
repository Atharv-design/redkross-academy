<svg xmlns="http://www.w3.org/2000/svg" width="678" height="255" viewBox="0 0 678 255" role="img" aria-labelledby="t d">
<title id="t">C20-M01-F2: The coverage join</title>
<desc id="d">Three inventories - telemetry, priority techniques and the detection pack - feed a coverage matrix with scores from 0 blind to 3 tested, with an asterisk for partial fleet coverage.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C20-M01-F2  The coverage join</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   TELEMETRY INVENTORY        PRIORITY TECHNIQUES        DETECTION PACK</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   log, hosts, retention      ATT&amp;CK ID, needed log      rules (tags), tests</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            \                         |                        /</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">             \________________________|_______________________/</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                      |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                              COVERAGE MATRIX</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                 0 blind | 1 visible | 2 detected | 3 tested</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                 (* = only part of the fleet sends this log)</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C20-M01-F2. Coverage joins three inventories; each score needs all three.</text>
</svg>