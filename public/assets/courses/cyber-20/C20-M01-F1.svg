<svg xmlns="http://www.w3.org/2000/svg" width="577" height="356" viewBox="0 0 577 356" role="img" aria-labelledby="t d">
<title id="t">C20-M01-F1: Prevent, observe, detect, respond - with feedback</title>
<desc id="d">Four boxes in a row - prevent, observe, detect, respond - fed by a threat model and priority techniques; arrows from respond and detect loop back to prevent and detect as lessons learned.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C20-M01-F1  Prevent, observe, detect, respond - with feedback</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   threat model --&gt; priority techniques</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                          |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                          v</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +---------+    +-----------+    +----------+    +-----------+</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   | PREVENT | -&gt; |  OBSERVE  | -&gt; |  DETECT  | -&gt; |  RESPOND  |</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   | MFA,    |    | endpoint, |    | rules,   |    | playbooks,|</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   | app     |    | identity, |    | hunts,   |    | people,   |</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   | control |    | network,  |    | analytics|    | SOAR      |</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   +---------+    | cloud     |    +----------+    +-----------+</text>
<text x="20" y="213" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        ^         +-----------+         ^                |</text>
<text x="20" y="230" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |                               |                |</text>
<text x="20" y="247" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        +------ lessons learned &lt;-------+----------------+</text>
<text x="20" y="264" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                (new controls, new detections, new telemetry)</text>
<text x="20" y="281" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="308" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C20-M01-F1. The four defensive functions and the feedback loops</text>
