<svg xmlns="http://www.w3.org/2000/svg" width="653" height="204" viewBox="0 0 653 204" role="img" aria-labelledby="t d">
<title id="t">C20-M04-F3: A test file&#x27;s three kinds of cases</title>
<desc id="d">A rule name with three test cases: one expected to match and two expected not to, one of which tests the filter.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C20-M04-F3  A test file&#x27;s three kinds of cases</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   rule: rk_domain_admin_group_enum</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   + workstation          net group &quot;Domain Admins&quot; on WS-03  -&gt; match</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   - other_group          net group Finance                   -&gt; no match</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   - admin_host_filtered  same command on ADM-01              -&gt; no match</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     (edge: proves the filter excludes exactly what it claims)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C20-M04-F3. Positive, negative and edge cases.</text>
</svg>