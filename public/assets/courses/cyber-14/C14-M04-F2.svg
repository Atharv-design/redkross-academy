<svg xmlns="http://www.w3.org/2000/svg" width="636" height="187" viewBox="0 0 636 187" role="img" aria-labelledby="t d">
<title id="t">C14-M04-F2: Levels of attribution</title>
<desc id="d">A four-step ladder from technical clustering at the bottom to state responsibility at the top, with the lab campaign placed on the first step.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C14-M04-F2  Levels of attribution</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   4  state or sponsor responsibility   (rarely within reach)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   3  organisation or individuals       (law enforcement, intelligence)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   2  association with an intrusion set (multiple strong lines needed)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   1  technical clustering / campaign   &lt;- MONSOON LANTERN is here</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C14-M04-F2. Each level needs more and different evidence.</text>
</svg>