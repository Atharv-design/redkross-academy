<svg xmlns="http://www.w3.org/2000/svg" width="653" height="237" viewBox="0 0 653 237" role="img" aria-labelledby="t d">
<title id="t">C14-M01-F2: Requirement hierarchy for Nilgiri PIR-2</title>
<desc id="d">A tree with PIR-2 at the top, one SIR below and two EEIs, each annotated with the report that addresses it.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C14-M01-F2  Requirement hierarchy for Nilgiri PIR-2</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   PIR-2  Is MONSOON LANTERN infrastructure active against us now?</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |      consumer: SOC lead   priority 1</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     +-- SIR-2.1  Do proxy or DNS logs show contact with campaign</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           |      infrastructure?</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           +-- EEI  matches of current IOCs in proxy_log  &lt;- RPT-006 (A1)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           +-- EEI  first and last contact times          &lt;- RPT-006 (A1)</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C14-M01-F2. From a decision-relevant question to data that collection can</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">find.</text>
</svg>