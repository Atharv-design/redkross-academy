<title id="t">C14-M01-F1: The intelligence lifecycle</title>
<desc id="d">A cycle of six labelled phases from direction through collection, processing, analysis, dissemination and feedback back to direction, with short notes under three phases.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
