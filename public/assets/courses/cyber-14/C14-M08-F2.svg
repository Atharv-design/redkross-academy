<svg xmlns="http://www.w3.org/2000/svg" width="636" height="221" viewBox="0 0 636 221" role="img" aria-labelledby="t d">
<title id="t">C14-M08-F2: From modules to brief</title>
<desc id="d">Six module outputs feed into the flash brief, which goes to three consumers and to a structured bundle.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C14-M08-F2  From modules to brief</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   M01 requirements, judgments ---+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   M02 grades, collection log ----+</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   M03 cluster (6 domains) -------+--&gt; flash brief --&gt; SOC / IR / CISO</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   M04 attribution limits --------+          |</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   M05 10 active IOCs, u017 ------+          +--&gt; STIX bundle via TAXII</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   M07 coverage 1/6/2 ------------+</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C14-M08-F2. Each module contributes evidence to the final product.</text>
</svg>