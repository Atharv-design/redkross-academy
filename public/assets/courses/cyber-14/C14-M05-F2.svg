<svg xmlns="http://www.w3.org/2000/svg" width="678" height="187" viewBox="0 0 678 187" role="img" aria-labelledby="t d">
<title id="t">C14-M05-F2: The IOC lifecycle</title>
<desc id="d">A loop of stages from ingest to deploy, observe, sightings, review and retire, returning to ingest.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C14-M05-F2  The IOC lifecycle</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   ingest -&gt; normalise -&gt; validate/allowlist -&gt; merge -&gt; enrich -&gt; score/age</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      ^                                                                |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      |                                                             deploy</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   retire/revoke &lt;- review &lt;- sightings &amp; outcomes &lt;- observe &lt;--------+</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C14-M05-F2. Every indicator moves through stages and eventually retires.</text>
</svg>