<svg xmlns="http://www.w3.org/2000/svg" width="644" height="187" viewBox="0 0 644 187" role="img" aria-labelledby="t d">
<title id="t">C14-M03-F2: Edge strength</title>
<desc id="d">Four rows grading types of shared attributes from strong to never usable.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C14-M03-F2  Edge strength</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   strong   same certificate fingerprint; same non-redacted registrant</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   medium   same dedicated IP within the campaign window</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   weak     same name server; same free CA; similar dates; CDN/shared IP</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   never    &quot;redacted-for-privacy&quot;; dummy values</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C14-M03-F2. Not all shared attributes are evidence.</text>
</svg>