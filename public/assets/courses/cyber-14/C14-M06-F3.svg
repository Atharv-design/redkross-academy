<svg xmlns="http://www.w3.org/2000/svg" width="535" height="220" viewBox="0 0 535 220" role="img" aria-labelledby="t d">
<title id="t">C14-M06-F3: TLP 2.0 at a glance</title>
<desc id="d">Five rows from RED to CLEAR, each with the audience allowed to receive the information.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C14-M06-F3  TLP 2.0 at a glance</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   RED           individual recipients only</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   AMBER+STRICT  recipient&#x27;s organisation only</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   AMBER         organisation and its clients, need-to-know</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   GREEN         the community, not public channels</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   CLEAR         no limit</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C14-M06-F3. The four TLP 2.0 labels and the AMBER+STRICT</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">variant, from most to least restrictive.</text>
</svg>