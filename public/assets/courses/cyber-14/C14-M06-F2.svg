<svg xmlns="http://www.w3.org/2000/svg" width="602" height="255" viewBox="0 0 602 255" role="img" aria-labelledby="t d">
<title id="t">C14-M06-F2: A TAXII 2.1 exchange</title>
<desc id="d">A request-response sequence between a client and the lab server, listing each request and the server&#x27;s answer.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C14-M06-F2  A TAXII 2.1 exchange</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   client                                   server (127.0.0.1:5005)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   GET /taxii2/  ------------------------&gt;  discovery (api_roots)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   GET /sharing/collections/ ------------&gt;  2 collections (rw, ro)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   POST .../91a7.../objects/ (bundle) ---&gt;  status complete 38/38</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   GET .../objects/?match[type]=indicator   10 objects</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   GET ... added_after=T                    objects added after T</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   POST .../472c.../objects/ ------------&gt;  403 (read-only)</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   wrong password -----------------------&gt;  401 + WWW-Authenticate</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C14-M06-F2. Discovery, publishing, filtered polling and access control.</text>
</svg>