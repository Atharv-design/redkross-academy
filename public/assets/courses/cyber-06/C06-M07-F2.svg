<svg xmlns="http://www.w3.org/2000/svg" width="644" height="203" viewBox="0 0 644 203" role="img" aria-labelledby="t d">
<title id="t">C06-M07-F2: Business logic flaw - client-trusted price</title>
<desc id="d">A comparison of trusting a client-supplied price against looking the price up server-side, with validated quantity and single-use coupon rules.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C06-M07-F2  Business logic flaw - client-trusted price</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   UNSAFE: price = float(form[&quot;price&quot;])   -&gt; attacker sets price = 0.01</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   SAFE  : price = catalogue.price_of(id) -&gt; server authoritative</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">           quantity validated (&gt;0, &lt;= max); coupon atomically single-use</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   rule: enforce every business rule and value on the server</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C06-M07-F2. The archetypal business-logic fix: server-side authority over</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">prices, quantities and rules.</text>
</svg>