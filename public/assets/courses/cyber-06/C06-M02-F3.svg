<svg xmlns="http://www.w3.org/2000/svg" width="644" height="186" viewBox="0 0 644 186" role="img" aria-labelledby="t d">
<title id="t">C06-M02-F3: The seven-step testing workflow</title>
<desc id="d">A seven-step cycle from authorisation through mapping, classification, verification, scoring, reporting and retesting, with a loop back to mapping.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C06-M02-F3  The seven-step testing workflow</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   1 authorise/scope -&gt; 2 map -&gt; 3 classify -&gt; 4 verify (min safe check)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   -&gt; 5 score (CVSS) + evidence -&gt; 6 report -&gt; 7 remediate + retest</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   loops back: new findings in step 4 can reveal new surface -&gt; re-map</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C06-M02-F3. The repeatable web security testing workflow the lab tools</text>
<text x="20" y="154" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">implement end to end [C06-M02-R1].</text>
</svg>