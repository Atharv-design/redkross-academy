<svg xmlns="http://www.w3.org/2000/svg" width="644" height="237" viewBox="0 0 644 237" role="img" aria-labelledby="t d">
<title id="t">C06-M01-F2: Anatomy of an HTTP exchange</title>
<desc id="d">A side-by-side HTTP request and response showing method, headers, the Set-Cookie line and the absent cookie security attributes.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C06-M01-F2  Anatomy of an HTTP exchange</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   REQUEST                         RESPONSE</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   GET /login?user=asha HTTP/1.1   HTTP/1.1 200 OK</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Host: 127.0.0.1:8200            Content-Type: text/html</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Cookie: session=...             Set-Cookie: session=YXNoYQ==; Path=/</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   (body for POST/PUT)             (missing: HttpOnly; Secure; SameSite)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                   (body: HTML the browser renders)</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C06-M01-F2. A request and response, with the session cookie and the missing</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">security attributes highlighted.</text>
</svg>