<svg xmlns="http://www.w3.org/2000/svg" width="695" height="237" viewBox="0 0 695 237" role="img" aria-labelledby="t d">
<title id="t">C06-M07-F1: Advanced risks and their defences</title>
<desc id="d">A table of advanced risks (XXE, insecure deserialization, business logic, API object access, API data exposure) with each cause and defence.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C06-M07-F1  Advanced risks and their defences</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   risk                 cause                       defence</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   XXE (CWE-611)        parser resolves ext. ents.  disable ext entities/DTD</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   deserialization(502) code-capable deserializer   use JSON; sign/type-limit</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   business logic       abusable workflow/rules     enforce rules server-side</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   API object access    id with no ownership check  object-level authorisation</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   API data exposure    too many fields in/out      return/accept only needed</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C06-M07-F1. Each advanced risk, its cause, and its defence</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">[C06-M07-R1][C06-M07-R5].</text>
</svg>