<svg xmlns="http://www.w3.org/2000/svg" width="611" height="203" viewBox="0 0 611 203" role="img" aria-labelledby="t d">
<title id="t">C06-M03-F2: Password storage done right</title>
<desc id="d">A progression from wrong storage (plain text, fast hash) to correct storage (Argon2id/bcrypt/scrypt with salt and work factor) and how verification works.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C06-M03-F2  Password storage done right</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   plain text  -&gt; breach reveals all passwords           (WRONG)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   fast hash   -&gt; billions of guesses/sec crack them     (WRONG)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Argon2id / bcrypt / scrypt + per-user salt + work factor  (RIGHT)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   verify = hash(input, salt) == stored; never reversible</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C06-M03-F2. Passwords are stored as slow, salted, purpose-built hashes,</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">never plain or fast-hashed [C06-M03-R2].</text>
</svg>