<svg xmlns="http://www.w3.org/2000/svg" width="712" height="220" viewBox="0 0 712 220" role="img" aria-labelledby="t d">
<title id="t">C06-M05-F2: SQL injection auth bypass in the lab</title>
<desc id="d">A worked example of a SQL injection authentication bypass in the vulnerable login query and the parameterised version that stops it.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C06-M05-F2  SQL injection auth bypass in the lab</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   vuln: &quot;...WHERE username=&#x27;%s&#x27; AND password=&#x27;%s&#x27;&quot; % (user, pw)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   input user = admin&#x27;--     pw = x</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   becomes: ...WHERE username=&#x27;admin&#x27;--&#x27; AND password=&#x27;x&#x27;</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   the -- comments out the password check -&gt; admin row returns -&gt; logged in</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   fixed: execute(&quot;...WHERE username=? AND password=?&quot;, (user, pw)) -&gt; no bypass</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C06-M05-F2. Concatenated SQL lets admin&#x27;-- bypass the password; parameterisation</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">prevents it [C06-M05-R2].</text>
</svg>