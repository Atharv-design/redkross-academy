<svg xmlns="http://www.w3.org/2000/svg" width="636" height="220" viewBox="0 0 636 220" role="img" aria-labelledby="t d">
<title id="t">C06-M03-F3: MFA strength ladder</title>
<desc id="d">A ladder of MFA options from password-only up to phishing-resistant hardware security keys, noting the weakness of each intermediate factor.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C06-M03-F3  MFA strength ladder</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   password only          weakest</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   + SMS code             better, but SIM-swap / interception</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   + TOTP app             better, but real-time phishable</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   + push approval        better, but MFA-fatigue</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   + hardware key WebAuthn phishing-resistant (origin-bound)  strongest</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C06-M03-F3. MFA factors from weakest to phishing-resistant; prefer</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">WebAuthn/FIDO2 for sensitive accounts [C06-M03-R3].</text>
</svg>