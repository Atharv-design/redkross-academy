<title id="t">C18-M08-F1: Failure path FP-1 with controls</title>
<desc id="d">A five-hop path from a planted document to a simulated unauthorised refund, with controls beneath each hop and observed results.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C18-M08-F1  Failure path FP-1 with controls</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  planted page --&gt; retrieved for refund question --&gt; model proposes refund</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   [audit, review]   [sanitise, retrieval scope]     [delimit - weak]</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        --&gt; refund tool --&gt; another customer&#x27;s account (simulated)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">            [policy in code: BLOCK; unit-tested]   [ledger alert]</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  naive: executed in 3/5 P5 runs     hardened: 0/5</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C18-M08-F1. One observed path and the control at each hop.</text>
