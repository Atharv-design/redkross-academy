<svg xmlns="http://www.w3.org/2000/svg" width="661" height="204" viewBox="0 0 661 204" role="img" aria-labelledby="t d">
<title id="t">C18-M05-F1: Output sinks and controls</title>
<desc id="d">Model output flows to five destinations, each with its control.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C18-M05-F1  Output sinks and controls</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  model output --&gt; UI           render as text, sanitise markdown, CSP</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">               --&gt; links/images allowlist hosts, strip images</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">               --&gt; SQL/API      parameterised, read-only, schema-validated</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">               --&gt; code/shell   sandbox + human review</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">               --&gt; tools        policy check in code, user authority, log</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C18-M05-F1. Each destination needs its own control.</text>
</svg>