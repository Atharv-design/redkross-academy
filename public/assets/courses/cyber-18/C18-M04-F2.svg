<svg xmlns="http://www.w3.org/2000/svg" width="628" height="170" viewBox="0 0 628 170" role="img" aria-labelledby="t d">
<title id="t">C18-M04-F2: P4 cross-customer disclosure (lab)</title>
<desc id="d">Leak counts for three configurations on the cross-customer probe.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C18-M04-F2  P4 cross-customer disclosure (lab)</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  naive        5/5 leaked  (C200 record retrieved into C100&#x27;s context)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  prompt_only  5/5 leaked  (wording does not help)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  hardened     0/5         (ACL retrieval + output redaction)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C18-M04-F2. Access control, not instructions, prevents disclosure.</text>
</svg>