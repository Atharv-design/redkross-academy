<svg xmlns="http://www.w3.org/2000/svg" width="787" height="221" viewBox="0 0 787 221" role="img" aria-labelledby="t d">
<title id="t">C18-M01-F1: Trust boundaries in an LLM application</title>
<desc id="d">User messages, documents and the system prompt join into one context for the model; its output passes through code-level tool policy and output filtering.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C18-M01-F1  Trust boundaries in an LLM application</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  user msg (untrusted) --+</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  KB docs (mixed) -------+--&gt; [assembled CONTEXT] --&gt; MODEL --&gt; output (untrusted)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  system prompt ---------+       (one token stream)              |</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                       +---------+---------+</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                       v                   v</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                                 tool policy (code)   output filter -&gt; UI</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C18-M01-F1. Mixed-trust text meets in one context; controls belong around the model.</text>
</svg>