<svg xmlns="http://www.w3.org/2000/svg" width="485" height="204" viewBox="0 0 485 204" role="img" aria-labelledby="t d">
<title id="t">C18-M07-F2: What 0 failures means</title>
<desc id="d">A table showing that zero failures in more runs gives a lower upper bound on the true failure rate.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C18-M07-F2  What 0 failures means</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  runs n   failures   95% upper bound on failure rate</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">    5         0          43%  (lab)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   20         0         ~16%</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   60         0          ~6%</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  rule of three: upper bound ~ 3/n</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C18-M07-F2. More runs, tighter claims.</text>
</svg>