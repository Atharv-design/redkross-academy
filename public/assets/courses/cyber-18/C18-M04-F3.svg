<svg xmlns="http://www.w3.org/2000/svg" width="695" height="170" viewBox="0 0 695 170" role="img" aria-labelledby="t d">
<title id="t">C18-M04-F3: Ingestion gate</title>
<desc id="d">Documents pass an audit; high findings go to review; clean documents are indexed and the manifest updated.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C18-M04-F3  Ingestion gate</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  new/changed doc -&gt; kb_audit (ACL? PII in public? record public? text to AI?)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     HIGH -&gt; human review -&gt; fix or reject</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     clean -&gt; index + update manifest (SHA-256)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C18-M04-F3. Audit before indexing.</text>
