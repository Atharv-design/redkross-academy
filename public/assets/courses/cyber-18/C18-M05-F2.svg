<svg xmlns="http://www.w3.org/2000/svg" width="644" height="187" viewBox="0 0 644 187" role="img" aria-labelledby="t d">
<title id="t">C18-M05-F2: Probe versus unit test</title>
<desc id="d">Two kinds of evidence: probes test system behaviour; unit tests prove the control.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C18-M05-F2  Probe versus unit test</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  probe (model-driven)   does the system propose/allow bad actions?</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                         hardened P5: model proposed none -&gt; 0/5</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  unit test (direct)     does the policy block them when proposed?</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                         7/7 tests pass (cross-customer, amount, window)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C18-M05-F2. Behaviour evidence and control evidence are different.</text>
</svg>