<title id="t">C18-M08-F3: From assessment to governance</title>
<desc id="d">A sequence from scoping to decision followed by continuous controls.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C18-M08-F3  From assessment to governance</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  scope -&gt; evidence -&gt; failure paths -&gt; mitigations -&gt; report -&gt; decision</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     -&gt; release gate + monitoring + re-assessment</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="121" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C18-M08-F3. The assessment feeds continuous governance.</text>
