<svg xmlns="http://www.w3.org/2000/svg" width="577" height="203" viewBox="0 0 577 203" role="img" aria-labelledby="t d">
<title id="t">C19-M03-F3: The evidence hash chain</title>
<desc id="d">A chain of evidence entries linked by hashes.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C19-M03-F3  The evidence hash chain</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   entry1{content, prev=GENESIS, hash=H1}</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      -&gt; entry2{content, prev=H1, hash=H2}</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">         -&gt; entry3{content, prev=H2, hash=H3}</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   verify: recompute each hash; any change -&gt; mismatch -&gt; BROKEN</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C19-M03-F3. Each evidence entry chains to the previous by hash,</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">making tampering detectable [C19-M03-R4].</text>
</svg>