<title id="t">C19-M02-F1: Threat-informed emulation</title>
<desc id="d">A pipeline from threat intelligence to a measured emulation.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C19-M02-F1  Threat-informed emulation</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   threat intel -&gt; threat profile -&gt; ATT&amp;CK techniques the adversary uses</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                -&gt; emulation plan (technique + target + boundary + detection)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                -&gt; run in isolated range -&gt; measure detection (purple team)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C19-M02-F1. Threat-informed emulation turns threat intelligence into a tested plan</text>
<text x="20" y="154" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">[C19-M02-R1].</text>
