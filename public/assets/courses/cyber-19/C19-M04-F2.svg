<svg xmlns="http://www.w3.org/2000/svg" width="552" height="203" viewBox="0 0 552 203" role="img" aria-labelledby="t d">
<title id="t">C19-M04-F2: Detection paired with containment</title>
<desc id="d">A technique paired with both a detection and a containment.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C19-M04-F2  Detection paired with containment</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Valid Accounts (T1078):</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     DETECT   : anomalous logon over authentication telemetry</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     CONTAIN  : MFA + tiered admin + logon restrictions</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   =&gt; see it AND make the credential less reusable</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C19-M04-F2. Each identity technique gets a detection and a</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">containment [C19-M04-R4].</text>
</svg>