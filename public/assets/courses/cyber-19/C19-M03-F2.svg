<svg xmlns="http://www.w3.org/2000/svg" width="510" height="203" viewBox="0 0 510 203" role="img" aria-labelledby="t d">
<title id="t">C19-M03-F2: Fail-safe scope enforcement</title>
<desc id="d">A decision that refuses targets not provably in scope.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C19-M03-F2  Fail-safe scope enforcement</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   target ---&gt; [ in authorised network or listed host? ]</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                   yes -&gt; IN-SCOPE (may act)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                   no  -&gt; OUT-OF-SCOPE (REFUSE)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   default when unsure = OUT-OF-SCOPE</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C19-M03-F2. Scope enforcement refuses anything not</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">provably in scope [C19-M03-R4].</text>
</svg>