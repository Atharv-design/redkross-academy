<svg xmlns="http://www.w3.org/2000/svg" width="628" height="203" viewBox="0 0 628 203" role="img" aria-labelledby="t d">
<title id="t">C19-M07-F1: The purple-team loop</title>
<desc id="d">A cycle of emulate, measure, engineer and re-emulate shared by red and blue.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C19-M07-F1  The purple-team loop</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   emulate technique (red) -&gt; measure detection (blue) -&gt; gap analysis</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        ^                                                      |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |----------------- re-emulate &lt;--- engineer detection &lt;-</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   collaborate throughout (shared ATT&amp;CK plan + telemetry)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C19-M07-F1. The collaborative emulate-measure-fix-retest loop</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">[C19-M07-R1].</text>
</svg>