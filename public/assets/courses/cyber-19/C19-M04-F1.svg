<svg xmlns="http://www.w3.org/2000/svg" width="796" height="187" viewBox="0 0 796 187" role="img" aria-labelledby="t d">
<title id="t">C19-M04-F1: Identity abuse and its telemetry</title>
<desc id="d">Three identity techniques mapped to telemetry and behavioural detections.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C19-M04-F1  Identity abuse and its telemetry</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   technique (living off the land)      -&gt;  telemetry            -&gt; detection</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Valid Accounts (T1078)               -&gt;  authentication logs  -&gt; anomalous logon</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Account Discovery (T1087)            -&gt;  directory/process    -&gt; bulk queries</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Use Alt Auth Material (T1550)        -&gt;  authentication logs  -&gt; orphan non-interactive</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C19-M04-F1. Identity techniques map to behavioural detections over telemetry [C19-M04-R1].</text>
</svg>