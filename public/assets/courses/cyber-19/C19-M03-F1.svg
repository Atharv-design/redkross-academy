<svg xmlns="http://www.w3.org/2000/svg" width="586" height="220" viewBox="0 0 586 220" role="img" aria-labelledby="t d">
<title id="t">C19-M03-F1: Mapping, validation and evidence within scope</title>
<desc id="d">Mapping, validation and evidence shown inside a scope boundary with a scope check gating every action.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C19-M03-F1  Mapping, validation and evidence within scope</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   authorised scope (the boundary)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |-- map assets + identities (in scope only)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |-- validate findings (minimal, non-destructive, reversible)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     |-- record evidence (attribution + time + integrity)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   every action: scope-checked first (fail-safe)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C19-M03-F1. Assessment disciplines operate inside the authorised</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">scope [C19-M03-R1].</text>
</svg>