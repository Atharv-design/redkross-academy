<title id="t">C19-M07-F3: A gap to a closed detection</title>
<desc id="d">A gap diagnosed, engineered and confirmed closed by re-emulation.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C19-M07-F3  A gap to a closed detection</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   GAP: T1087 Account Discovery (no alert)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     diagnose : no directory-read telemetry/rule</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     engineer : collect directory/process logs + build bulk-query rule</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     re-emulate: run T1087 in range -&gt; detection fires -&gt; CLOSED</text>
