<svg xmlns="http://www.w3.org/2000/svg" width="678" height="204" viewBox="0 0 678 204" role="img" aria-labelledby="t d">
<title id="t">C05-M04-F1: CVE versus CWE</title>
<desc id="d">A contrast between CVE as a specific product flaw and CWE as a product-independent weakness type, with three example CWEs.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M04-F1  CVE versus CWE</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   CVE  : a SPECIFIC flaw in a specific product/version (what scanners cite)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   CWE  : a TYPE of weakness, product-independent</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          CWE-798 hard-coded creds | CWE-639 IDOR/authz bypass | CWE-209</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">          error-message disclosure</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   use CVE for known versioned flaws; CWE to classify what you find</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M04-F1. CVE names a specific vulnerability; CWE names a weakness type.</text>
</svg>