<svg xmlns="http://www.w3.org/2000/svg" width="686" height="220" viewBox="0 0 686 220" role="img" aria-labelledby="t d">
<title id="t">C05-M08-F1: Report structure for two audiences</title>
<desc id="d">A five-part report structure from executive summary through ranked findings to appendices.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M08-F1  Report structure for two audiences</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   1 Executive summary   (leadership: risk, key findings, recommendation)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   2 Scope &amp; methodology (what/how/authorisation)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   3 Findings (ranked)   (title, CVSS, evidence, impact, remediation, retest)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   4 Remediation summary (prioritised actions)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   5 Appendices          (raw evidence, tool output, vectors)</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M08-F1. One report serves executives and technical staff; detail lives in the</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">findings and appendices.</text>
</svg>