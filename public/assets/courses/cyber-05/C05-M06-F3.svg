<svg xmlns="http://www.w3.org/2000/svg" width="586" height="203" viewBox="0 0 586 203" role="img" aria-labelledby="t d">
<title id="t">C05-M06-F3: Impact to defence</title>
<desc id="d">A proven impact mapping to both a prevention and a detection control.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M06-F3  Impact to defence</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   proven impact (IDOR: read others&#x27; invoices)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        |-- prevention : authorisation check per object</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">        +-- detection  : log/alert on access to non-owned objects</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   every proven impact yields a prevention AND a detection</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M06-F3. Offensive understanding translated into defensive</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">controls.</text>
</svg>