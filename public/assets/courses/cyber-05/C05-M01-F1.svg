<svg xmlns="http://www.w3.org/2000/svg" width="628" height="271" viewBox="0 0 628 271" role="img" aria-labelledby="t d">
<title id="t">C05-M01-F1: Authorisation is the line</title>
<desc id="d">One technical action branches into a lawful engagement when authorised and in scope, and an offence when not.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M01-F1  Authorisation is the line</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   same technical action: connect to a service and probe it</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      |                                   |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      v                                   v</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   WITH written authorisation        WITHOUT authorisation</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   + in scope + safe RoE             or out of scope</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      |                                   |</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">      v                                   v</text>
<text x="20" y="179" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   lawful, valued engagement         an offence (IT Act 2000 ss.43/66)</text>
<text x="20" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="223" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M01-F1. The same action is a profession or a crime depending on</text>
<text x="20" y="239" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">authorisation and scope.</text>
</svg>