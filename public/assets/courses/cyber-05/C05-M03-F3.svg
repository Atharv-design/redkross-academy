<svg xmlns="http://www.w3.org/2000/svg" width="586" height="186" viewBox="0 0 586 186" role="img" aria-labelledby="t d">
<title id="t">C05-M03-F3: Scope enforced in tooling</title>
<desc id="d">The enumeration tool proceeds only for the loopback target and refuses any other host before probing.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M03-F3  Scope enforced in tooling</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   target host == loopback (in scope)   -&gt; proceed</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   target host != loopback              -&gt; REFUSE, exit, no probe</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   a typo or stray lead cannot become an out-of-scope action</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M03-F3. The lab tool enforces the scope boundary so a mistake</text>
<text x="20" y="154" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">cannot cause an out-of-scope probe.</text>
</svg>