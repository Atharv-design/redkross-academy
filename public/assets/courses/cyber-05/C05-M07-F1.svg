<svg xmlns="http://www.w3.org/2000/svg" width="586" height="237" viewBox="0 0 586 237" role="img" aria-labelledby="t d">
<title id="t">C05-M07-F1: Vertical versus horizontal escalation</title>
<desc id="d">A diagram contrasting vertical escalation to admin with horizontal access to another user&#x27;s data at the same level.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M07-F1  Vertical versus horizontal escalation</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   privilege level</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     admin   &lt;== VERTICAL (user -&gt; admin; lab default credential)</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">       ^</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     user A  --HORIZONTAL--&gt; user B&#x27;s data (same level; lab IDOR)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">     user B</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   least privilege + authz checks + patching prevent both</text>
<text x="20" y="162" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="189" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M07-F1. Vertical escalation raises privilege level; horizontal</text>
<text x="20" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">reaches a peer&#x27;s resources at the same level.</text>
</svg>