<svg xmlns="http://www.w3.org/2000/svg" width="577" height="220" viewBox="0 0 577 220" role="img" aria-labelledby="t d">
<title id="t">C05-M05-F1: A test-plan row</title>
<desc id="d">A test-plan row for the invoice endpoint with hypothesis, method, expected result, safety note and the minimal proof.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M05-F1  A test-plan row</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   hypothesis : /invoice has no access control</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   method     : request another customer&#x27;s invoice, no auth</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   expected   : returns data it should not</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   safety     : read ONE record, no writes; stop if out of scope</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   -&gt; minimal proof = one unauthorised read</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M05-F1. Each test-plan row ties a hypothesis to a method, an</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">expected result and a safety note.</text>
</svg>