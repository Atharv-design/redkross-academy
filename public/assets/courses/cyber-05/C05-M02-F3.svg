<svg xmlns="http://www.w3.org/2000/svg" width="619" height="220" viewBox="0 0 619 220" role="img" aria-labelledby="t d">
<title id="t">C05-M02-F3: robots.txt is not a control</title>
<desc id="d">The gap between the owner&#x27;s intent to hide paths and the reality that robots.txt publicly lists them to testers.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M02-F3  robots.txt is not a control</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   owner intent : &quot;hide /admin and /invoice from search engines&quot;</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   reality      : robots.txt is PUBLIC and lists them</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   crawler      : obeys Disallow (may skip them)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   tester/attacker: reads robots.txt first -&gt; priority targets</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   fix          : protect endpoints with authorisation, not obscurity</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M02-F3. robots.txt guides crawlers but advertises sensitive paths to</text>
<text x="20" y="188" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">anyone who reads it.</text>
</svg>