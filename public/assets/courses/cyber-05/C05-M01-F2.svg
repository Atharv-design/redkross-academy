<svg xmlns="http://www.w3.org/2000/svg" width="586" height="203" viewBox="0 0 586 203" role="img" aria-labelledby="t d">
<title id="t">C05-M01-F2: NIST SP 800-115 four phases</title>
<desc id="d">Four phases in sequence from planning to reporting, with a feedback arrow from attack back to discovery.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M01-F2  NIST SP 800-115 four phases</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   Planning --&gt; Discovery --&gt; Attack --&gt; Reporting</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                   ^            |</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                   +--feedback--+   (new info found during Attack</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">                                     returns to Discovery)</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M01-F2. The four phases, with the Attack-to-Discovery feedback</text>
<text x="20" y="171" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">loop that makes testing iterative [C05-M01-R1].</text>
</svg>