<svg xmlns="http://www.w3.org/2000/svg" width="628" height="204" viewBox="0 0 628 204" role="img" aria-labelledby="t d">
<title id="t">C05-M06-F2: Safe proof-of-concept principles</title>
<desc id="d">The four safe-PoC principles with the rule that if any fails, use an isolated lab or do not run the proof.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b0000">C05-M06-F2  Safe proof-of-concept principles</text>
<text x="20" y="60" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   isolation     : own, separated target (loopback lab)</text>
<text x="20" y="77" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   minimal action: smallest step that shows impact</text>
<text x="20" y="94" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   reversibility : change nothing, or undo fully (keep backups)</text>
<text x="20" y="111" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   containment   : cannot spread or reach other systems</text>
<text x="20" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">   all four hold -&gt; safe PoC ; any fails -&gt; isolated lab or do not run</text>
<text x="20" y="145" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111" xml:space="preserve">  </text>
<text x="20" y="172" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">Figure C05-M06-F2. The four principles that make a proof-of-concept safe.</text>
</svg>