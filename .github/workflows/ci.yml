name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_runner -d ci_db"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: "postgresql://ci_runner:ci_password@127.0.0.1:5432/ci_db"
      TEST_DATABASE_URL: "postgresql://ci_runner:ci_password@127.0.0.1:5432/ci_db"
      CREDENTIAL_SIGNING_SECRET: "ci-only-signing-secret-not-used-anywhere-else-0000"
      VITE_FIREBASE_API_KEY: "ci_test_key"
      VITE_FIREBASE_PROJECT_ID: "academy-redkross"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pre-Flight Environment Audit
        run: node scripts/verify-env.js

      - name: Apply schema and migrations
        run: node scripts/runMigrations.js

      - name: Unit tests and library integrity
        run: npm test

      - name: API security and assessment tests (real Postgres)
        run: npm run test:api

      - name: Production Build
        run: npm run build

      - name: Audit client bundle (no answer keys, no secrets)
        run: npm run audit:bundle
